# Security headers for both apps (specs/151, #294), included in EVERY location of default.conf.template: nginx drops a
# server's add_header in any location that sets one of its own, and every location here sets Cache-Control. `always`
# sends them on errors too. HSTS is Caddy's (server/deploy/Caddyfile): nginx here speaks plain HTTP.

# Scripts, fonts and connections from this origin only - every API call is same-origin (/api, forwarded to the gateway).
# Styles from this origin AND inline: Sonner and TipTap inject <style> elements at run time, and sanitised HTML (notices,
# email previews, the editor's content) carries style attributes - research D2. Scripts stay strictly 'self', which is
# what stops an injected script from running at all. Images from this origin (product images are /api/...), data:
# (inline SVG icons) and blob: (a photograph's preview before upload). No plugins, no <base> rewriting, forms post
# here, no page may frame this one. verify-storefront-image.sh pins this exact policy.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header X-Content-Type-Options "nosniff" always;
# frame-ancestors above, for browsers that predate it.
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
# Nothing in the shop uses these; a script that slips in cannot either.
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=()" always;
# The page gets a browsing context group of its own: a window it opens, or that opened it, holds no reference to it.
add_header Cross-Origin-Opener-Policy "same-origin" always;
# Cross-origin isolation (ZAP 90004): everything both apps load is their own origin, so requiring CORP of subresources
# costs nothing, and nothing of theirs may be loaded by another site - no email embeds a product image.
add_header Cross-Origin-Embedder-Policy "require-corp" always;
add_header Cross-Origin-Resource-Policy "same-origin" always;
