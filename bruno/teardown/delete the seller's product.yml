info:
  name: delete the seller's product
  type: http
  seq: 2

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/{{sellerProductId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("gone: 204, or 404 when something earlier already removed it", function() {
          expect([204, 404]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The product the seller listed in `seller/`. An administrator may delete anybody's (moderation is the job).
