info:
  name: set quantity
  type: http
  seq: 3

http:
  method: PUT
  url: "{{baseUrl}}/api/cart/items/{{productId}}"
  body:
    type: json
    data: |-
      {
        "quantity": 2
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
