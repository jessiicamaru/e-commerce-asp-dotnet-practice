info:
  name: the merged cart holds it once, two of it
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/cart"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("one line of two, not four", function() {
          expect(res.body.lines).to.have.length(1);
          expect(res.body.lines[0].quantity).to.equal(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  the merged cart holds it once, two of it
