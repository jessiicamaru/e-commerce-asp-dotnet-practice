http:
  method: POST
  url: "{{baseUrl}}/api/cart/items"
  body:
    type: json
    data: |-
      {
        "productId": "{{productId}}",
        "quantity": 2
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
