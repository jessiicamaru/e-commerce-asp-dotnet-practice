info:
  name: merge a browser cart at sign-in
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/cart/merge"
  body:
    type: json
    data: |-
      {
        "lines": [
          { "productId": "{{productId}}", "variantId": "{{productId}}", "quantity": 2 }
        ]
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 204", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/162: signed in. Added when absent, raised to the browser's quantity when the cart holds fewer - never lowered.
