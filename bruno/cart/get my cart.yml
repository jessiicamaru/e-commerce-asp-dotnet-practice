info:
  name: get my cart
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/cart"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Prices are **today's catalogue price**, looked up on every read - the cart stores none.
  If Catalog is down the lines still show, with `pricesAvailable: false` and `canCheckOut: false`.
