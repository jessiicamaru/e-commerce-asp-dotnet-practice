info:
  name: payment exports my payments
  type: http
  seq: 5

http:
  method: GET
  url: "{{baseUrl}}/api/payments/my-data"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("answers for payment, with every section", function() {
          expect(res.body.service).to.equal("payment");
          // Every section Payment declares (#364): the gateway checkouts joined them with VNPay (specs/143).
          expect(res.body.sections).to.have.all.keys("payments", "refunds", "paymentCheckouts");
          expect(res.body.withheld).to.be.an("array");
        });
        test("my payments are in it, and still say no money moved", function() {
          expect(res.body.sections.payments.length).to.be.greaterThan(0);
          expect(res.body.sections.payments[0].provider).to.equal("Stub");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/111 (#217). The caller's own, from the token - there is no id in the address to ask about anybody else.
