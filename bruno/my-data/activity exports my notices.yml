info:
  name: activity exports my notices
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/my-data"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("answers for activity, with every section", function() {
          expect(res.body.service).to.equal("activity");
          expect(res.body.sections).to.have.all.keys("notifications", "activity");
          expect(res.body.withheld).to.be.an("array");
        });
        test("my notices are in it, and no staff identity or snapshot", function() {
          expect(res.body.sections.notifications.length).to.be.greaterThan(0);
          var text = JSON.stringify(res.body);
          expect(text).to.not.contain("actorEmail");
          expect(text).to.not.contain("\"before\"");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/111 (#217). The caller's own, from the token - there is no id in the address to ask about anybody else.
