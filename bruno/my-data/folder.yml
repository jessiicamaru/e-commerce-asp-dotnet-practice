docs: |-
  What the shop holds about the customer (specs/111, #217) - one request per service, each the caller's own, as the
  storefront's "Download my data" asks them. Late in the run, so the customer by now has orders, a payment and notices.
  Then a person of its own registers and deletes their account (specs/112): refused on a wrong password, gone on the
  right one, and their email free again.
