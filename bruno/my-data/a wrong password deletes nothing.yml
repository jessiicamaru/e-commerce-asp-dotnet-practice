info:
  name: a wrong password deletes nothing
  type: http
  seq: 9

http:
  method: DELETE
  url: "{{baseUrl}}/api/auth/me"
  body:
    type: json
    data: |-
      {
        "password": "not-my-password"
      }
  auth:
    type: bearer
    token: "{{leaverToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400, on the password", function() {
          expect(res.status).to.equal(400);
          expect(res.body.errors.Password).to.be.an("array").that.is.not.empty;
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
