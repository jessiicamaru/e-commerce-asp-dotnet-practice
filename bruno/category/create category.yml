info:
  name: create category
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/categories"
  body:
    type: json
    data: |-
      {
        "name": "Smart phone {{runId}}",
        "description": "Authentic smart phone",
        "slug": "smart-phone-{{runId}}",
        "parentCategoryId": null
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Slugs are unique; a timestamp lets this run more than once.
        bru.setVar("runId", Date.now());
    - type: after-response
      code: |-
        if (res.body && res.body.id) bru.setVar("categoryId", res.body.id);
    - type: tests
      code: |-
        test("status is one of 200, 201", function() {
          expect([200, 201]).to.include(res.status);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
