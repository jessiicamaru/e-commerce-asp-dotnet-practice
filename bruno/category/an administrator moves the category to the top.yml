info:
  name: an administrator moves the category to the top
  type: http
  seq: 13

http:
  method: PUT
  url: "{{baseUrl}}/api/categories/{{subCategoryId}}/parent"
  body:
    type: json
    data: |-
      {
        "parentCategoryId": null
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200, a department now", function() {
          expect(res.status).to.equal(200);
          expect(res.body.parentCategoryId).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/158: PUT /api/categories/{id}/parent - its own endpoint, so a rename never moves anything. Audited as CategoryMoved.
