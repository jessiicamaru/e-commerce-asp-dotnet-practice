info:
  name: customer cannot add a variant (403)
  type: http
  seq: 16

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/variants"
  body:
    type: json
    data: |-
          {
            "sku": "NOPE-{{$randomInt}}",
            "price": 1,
            "options": [{ "name": "Colour", "value": "Free" }]
          }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
