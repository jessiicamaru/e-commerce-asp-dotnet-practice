info:
  name: notifications without a token is 401
  type: http
  seq: 44

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/unread-count"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  An inbox belongs to whoever the token names; without one there is nobody to ask about (specs/042).
