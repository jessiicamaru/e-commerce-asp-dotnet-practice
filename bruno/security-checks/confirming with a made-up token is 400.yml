info:
  name: confirming with a made-up token is 400
  type: http
  seq: 52

http:
  method: POST
  url: "{{baseUrl}}/api/auth/confirm-email"
  body:
    type: json
    data: |-
      {
        "token": "made-up-{{$randomUUID}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("the same refusal for used, expired and made up", function() {
          const errors = (res.body.errors || {}).Token || [];
          expect(errors.join(" ")).to.contain("invalid or has expired");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/063 (#106): one guarded UPDATE decides - unused and unexpired, or this 400.
