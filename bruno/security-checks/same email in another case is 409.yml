info:
  name: same email in another case is 409
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmailUpper}}",
        "password": "{{customerPassword}}",
        "firstName": "Bruno",
        "lastName": "Shouting"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("customerEmailUpper", (bru.getVar("customerEmail") || bru.getEnvVar("customerEmail")).toUpperCase());
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The customer's own email, upper-cased. It registered a second account until #49, because emails
  were compared case-sensitively.
