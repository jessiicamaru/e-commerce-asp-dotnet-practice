info:
  name: a payout with no currency is 400
  type: http
  seq: 38

http:
  method: POST
  url: "{{baseUrl}}/api/orders/payouts"
  body:
    type: json
    data: |-
      {
        "sellerId": "0199a000-0000-7000-8000-000000000001",
        "currency": ""
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("names the field", function() {
          expect(JSON.stringify(res.body.errors)).to.contain("Currency");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `RecordPayoutCommandValidator` (specs/037): a seller and a three-letter currency, and nothing else - there
  is deliberately no amount to send.
