info:
  name: a forged VNPay notification is 97
  type: http
  seq: 86

http:
  method: GET
  url: "{{baseUrl}}/api/payments/vnpay/ipn?vnp_Amount=100&vnp_ResponseCode=00&vnp_TransactionStatus=00&vnp_TmnCode=SIMULATR&vnp_TxnRef=0199a1b2c3d4e5f60718293a4b5c6d7e&vnp_SecureHash=deadbeef"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        // The IPN is public: its only authority is VNPay's signature (specs/143). A guessed one is refused in VNPay's
        // own code, and nothing about the shop's orders is looked at for it.
        test("answered, as VNPay expects (200)", function() {
          expect(res.status).to.equal(200);
        });
        test("refused: invalid signature (97)", function() {
          expect(res.body.RspCode).to.equal("97");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
