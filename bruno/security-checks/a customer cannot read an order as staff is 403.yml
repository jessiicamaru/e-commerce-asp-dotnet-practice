info:
  name: a customer cannot read an order as staff is 403
  type: http
  seq: 40

http:
  method: GET
  url: "{{baseUrl}}/api/orders/fulfilment/{{orderId}}"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The staff read has no owner check - the Admin role on the route is the whole permission (specs/038).
  This is the request that fails if that attribute is ever dropped, which would let anybody signed in
  read anybody's order and address.
