info:
  name: duplicate registration is 409
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{customerPassword}}",
        "firstName": "Bruno",
        "lastName": "Again"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Registering an email that already has an account is a **409**, through the shared ProblemDetails
  handler. It was a 500 until #28: `RegisterCommandHandler` threw a bare `System.Exception`, which the
  handler cannot map.
