info:
  name: duplicate registration is 409
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{customerPassword}}",
        "firstName": "Bruno",
        "lastName": "Again"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  **Known failing (2026-09-21): returns 500.** `RegisterCommandHandler` throws a bare
  `System.Exception("Email is already registered")`, which the shared `GlobalExceptionHandler`
  cannot map, so a client mistake is reported as a server fault. Should throw
  `Ecommerce.Shared.Exceptions.ConflictException`. This check stays red until that is fixed.
