info:
  name: a variant with the same options is 409
  type: http
  seq: 15

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/variants"
  body:
    type: json
    data: |-
          {
            "sku": "{{variantSku}}-2",
            "price": 10,
            "options": [{ "name": "colour", "value": "graphite" }]
          }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Two shapes a customer cannot tell apart are not two shapes. Case and spacing are ignored when
  comparing - "Graphite" and " graphite " are the same choice.
