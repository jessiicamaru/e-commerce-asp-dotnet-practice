info:
  name: a customer cannot list sales is 403
  type: http
  seq: 32

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `[Authorize(Roles = "Seller")]` (specs/034). A customer is signed in, so this is 403 rather than
  401 - and it is the request that fails if the attribute is ever dropped, which no unit test can
  see because they call the handler directly.
