info:
  name: reset with a made-up token is 400
  type: http
  seq: 51

http:
  method: POST
  url: "{{baseUrl}}/api/auth/reset-password"
  body:
    type: json
    data: |-
      {
        "token": "made-up-{{$randomUUID}}",
        "password": "N3w-Passw0rd!"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("the refusal is about the link, and says the same for used, expired or made up", function() {
          const errors = (res.body.errors || {}).Token || [];
          expect(errors.join(" ")).to.contain("invalid or has expired");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/061 (#103): one guarded UPDATE decides - unused and unexpired, or this 400.
