info:
  name: negative quantity is rejected (400)
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/cart/items"
  body:
    type: json
    data: |-
      {
        "productId": "{{productId}}",
        "quantity": -1
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Was accepted with 204 until feature 010 - void commands skipped validation entirely.
