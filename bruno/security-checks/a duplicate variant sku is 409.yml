info:
  name: a duplicate variant sku is 409
  type: http
  seq: 14

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/variants"
  body:
    type: json
    data: |-
          {
            "sku": "{{variantSku}}",
            "price": 10,
            "options": [{ "name": "Colour", "value": "Sand" }]
          }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A sku identifies one sellable thing across the whole catalogue.
