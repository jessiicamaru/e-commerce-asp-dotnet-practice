info:
  name: deleting an account without a token is 401
  type: http
  seq: 84

http:
  method: DELETE
  url: "{{baseUrl}}/api/auth/me"
  body:
    type: json
    data: |-
      {
        "password": "anything"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
