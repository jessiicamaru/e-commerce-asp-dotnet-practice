info:
  name: a page of the staff list holds at most 50
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/reviews?hidden=true&pageSize=100000"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("names the page size", function() {
          expect(res.body.errors).to.have.property("PageSize");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/094 (#186): the staff list had no paging rule - 100,000 reviews was one response. It is held to 1-50 like
  every other paged list in Catalog.
