info:
  name: reporting it again is 409
  type: http
  seq: 13

http:
  method: POST
  url: "{{baseUrl}}/api/reports"
  body:
    type: json
    data: |-
      {
        "targetType": "Review",
        "targetId": "{{reviewId}}",
        "reason": "Spam",
        "details": "Bruno reports it"
      }
  auth:
    type: bearer
    token: "{{modToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  One open report per person per thing: a partial unique index, not a check-then-insert.
