    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("gone", function() {
          expect(res.body.items.filter(function(r) { return r.id === bru.getVar("reviewId"); })).to.have.length(0);
        });

