info:
  name: staff see it in the reports queue
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/reports?pageSize=100"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the review is waiting, counted", function() {
          var item = res.body.items.find(function(i) { return i.targetId === bru.getVar("reviewId"); });
          expect(item.targetType).to.equal("Review");
          expect(item.reportCount).to.equal(1);
          expect(item.details).to.include("Bruno reports it");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
