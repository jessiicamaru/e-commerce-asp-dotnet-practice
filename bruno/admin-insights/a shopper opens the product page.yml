info:
  name: a shopper opens the product page
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/view"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 204", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The storefront reports each product page it opens. Anonymous; counted per product per day.
