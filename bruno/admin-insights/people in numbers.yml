info:
  name: people in numbers
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/users/stats"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("customers, sellers and staff counted", function() {
          expect(res.body.customers).to.be.at.least(1);
          expect(res.body.sellers).to.be.at.least(1);
          expect(res.body.admins).to.be.at.least(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The headline numbers about people.
