info:
  name: an administrator revokes moderator
  type: http
  seq: 20

http:
  method: DELETE
  url: "{{baseUrl}}/api/users/{{modId}}/roles/Moderator"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("Moderator is gone", function() {
          expect(res.body.roles).to.not.include("Moderator");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The role leaves the tokens already issued within seconds (specs/065, #112): the next request with the
  moderator's old token is refused, and their next refresh carries no Moderator. Run LAST, after every request
  that uses the moderator's token - it is here, at the end of the last folder, for that reason.
