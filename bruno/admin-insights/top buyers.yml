info:
  name: top buyers
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/orders/insights/top-buyers?limit=50"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("biggest dong spend first", function() {
          expect(res.body.length).to.be.at.least(1);
          var dong = function(b) {
            var row = b.spent.filter(function(s) { return s.currency === "VND"; })[0];
            return row ? row.amount : 0;
          };
          for (var i = 1; i < res.body.length; i++) {
            expect(dong(res.body[i - 1])).to.be.at.least(dong(res.body[i]));
          }
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Ids only: Order does not know emails. The next request asks Identity who they are.
