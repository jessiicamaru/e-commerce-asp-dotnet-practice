info:
  name: a period longer than 366 days is refused
  type: http
  seq: 10

http:
  method: GET
  url: "{{baseUrl}}/api/orders/insights/top-products?from=2024-01-01T00:00:00Z&to=2025-12-31T00:00:00Z"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("says the limit", function() {
          expect(JSON.stringify(res.body)).to.contain("at most 366 days");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  One period rule for every insight (specs/055, #125): whole UTC days, both ends included, at most 366.
  Only revenue had the limit before; top products, top buyers and top viewed now refuse it the same way.
