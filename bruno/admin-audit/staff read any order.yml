info:
  name: staff read any order
  type: http
  seq: 9

http:
  method: GET
  url: "{{baseUrl}}/api/orders/fulfilment/{{orderId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the whole order, with where it goes and its parcels", function() {
          expect(res.body.orderId).to.equal(bru.getVar("orderId"));
          expect(res.body.items).to.be.an("array").that.is.not.empty;
          expect(res.body.shippingAddress).to.be.an("object");
          expect(res.body.shipments).to.be.an("array");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Staff can read ANY order (specs/038) - they ship the shop's parcel and cannot ship what they cannot
  see. `GET /api/orders/{id}` answers the order's owner only, and this is the one read that is not.
