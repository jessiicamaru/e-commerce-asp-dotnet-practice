info:
  name: reservation for order
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/reservations/{{orderId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Inventory. How many units the order held, and whether they were confirmed or released.
