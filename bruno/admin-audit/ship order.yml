info:
  name: ship order
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/orders/{{orderId}}/shipment"
  body:
    type: json
    data: |-
      {
        "trackingReference": "BRUNO-{{orderId}}"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        // The buyer is emailed that it is on its way (specs/083, #167). Mailpit keeps every email the stack
        // sends; the dispatcher sends every 15 seconds, so wait up to 40 for the one naming this tracking reference.
        const axios = require("axios");
        const mailpit = bru.interpolate("{{mailpitUrl}}");
        const tracking = "BRUNO-" + bru.getVar("orderId");
        let subject = null;
        for (let i = 0; i < 40 && !subject && res.status === 200; i++) {
          const found = await axios.get(mailpit + "/api/v1/search?query=" + encodeURIComponent(tracking));
          const message = (found.data.messages || [])[0];
          if (message) subject = message.Subject;
          else await bru.sleep(1000);
        }
        bru.setVar("shippedEmailSubject", subject || "no-email-arrived");
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("now Shipped, with the tracking reference", function() {
          expect(res.body.status).to.equal("Shipped");
          expect(res.body.trackingReference).to.contain("BRUNO-");
        });
        test("the buyer is emailed that it is on its way, with the tracking reference (specs/083)", function() {
          expect(bru.getVar("shippedEmailSubject")).to.match(/is on its way|đang trên đường/);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Preparing -> Shipped. The same reference again is a no-op; a different one is 409. The buyer is emailed
  (specs/083), read back from Mailpit.
