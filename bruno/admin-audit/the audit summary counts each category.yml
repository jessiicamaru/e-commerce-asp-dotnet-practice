info:
  name: the audit summary counts each category
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/audit/summary"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("counts per category", function() {
          expect(res.body).to.be.an("array").that.is.not.empty;
          res.body.forEach(function(c) { expect(c.count).to.be.above(0); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  How many entries each category holds - the admin console's tab numbers (specs/041).
