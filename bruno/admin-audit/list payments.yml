info:
  name: list payments
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/payments?pageNumber=1&pageSize=20"
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Optional filters: `orderId`, `status`.
