info:
  name: staff accept the return
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/orders/fulfilment/{{orderId}}/shipments/{{shipmentId}}/return/accept"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("accepted", function() {
          expect(res.body.status).to.equal("Accepted");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
