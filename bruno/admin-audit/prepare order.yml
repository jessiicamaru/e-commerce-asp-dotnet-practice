info:
  name: prepare order
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/orders/{{orderId}}/preparing"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("now Preparing", function() {
          expect(res.body.status).to.equal("Preparing");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Paid -> Preparing. Sending it again is a no-op (200); from any other state it is 409.
