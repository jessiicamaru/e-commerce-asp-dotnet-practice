info:
  name: the customer sends it back
  type: http
  seq: 21

http:
  method: POST
  url: "{{baseUrl}}/api/orders/{{orderId}}/shipments/{{shipmentId}}/return/sent"
  body:
    type: json
    data: |-
      {
        "trackingReference": "VNPOST-RETURN-BRUNO"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("on its way back, with the reference", function() {
          expect(res.body.status).to.equal("SentBack");
          expect(res.body.trackingReference).to.equal("VNPOST-RETURN-BRUNO");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
