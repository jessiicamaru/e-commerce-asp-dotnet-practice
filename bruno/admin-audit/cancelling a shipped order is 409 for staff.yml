info:
  name: cancelling a shipped order is 409 for staff
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/orders/fulfilment/{{orderId}}/cancel"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });
        test("says why, in words", function() {
          expect(res.body.detail).to.contain("shipped");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/039: once a parcel has shipped nobody can cancel - not even staff, who otherwise may cancel while
  a parcel is being prepared. The order in this collection was shipped by `ship order` just before.
