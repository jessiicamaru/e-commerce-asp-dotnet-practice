info:
  name: change my password
  type: http
  seq: 10

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "Old-Passw0rd!bruno",
        "newPassword": "N3w-Passw0rd!bruno"
      }
  auth:
    type: bearer
    token: "{{throwawayToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // A throwaway account, so the collection's own customer keeps the password the environment names.
        const axios = require("axios");
        const email = "bruno-password-" + Date.now() + "@local.test";
        const registered = await axios.post(bru.interpolate("{{baseUrl}}/api/auth/register"),
          { email: email, password: "Old-Passw0rd!bruno", firstName: "Bruno", lastName: "Throwaway" });
        bru.setVar("throwawayEmail", email);
        bru.setVar("throwawayToken", registered.data.token);
    - type: tests
      code: |-
        test("status 204", function() {
          expect(res.status).to.equal(204);
        });
        test("the new password signs in", async function() {
          const axios = require("axios");
          const signedIn = await axios.post(bru.interpolate("{{baseUrl}}/api/auth/login"),
            { email: bru.getVar("throwawayEmail"), password: "N3w-Passw0rd!bruno" });
          expect(signedIn.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
