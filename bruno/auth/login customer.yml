info:
  name: login customer
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setVar("customerToken", res.body.token);
    - type: tests
      code: |-
        test("the response says which roles the customer holds", function() {
          expect(res.body.roles).to.be.an("array");
          expect(res.body.roles).to.include("Customer");
          expect(res.body.roles).to.not.include("Seller");
        });
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
            test("returns a token, and hides the refresh token from the body", function() {
              expect(res.body.token).to.be.a("string").and.not.empty;
              expect(res.body.refreshToken).to.equal("");
            });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
