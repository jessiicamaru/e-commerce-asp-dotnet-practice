info:
  name: a handoff works once
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/api/auth/handoff/redeem"
  body:
    type: json
    data: |-
      {
        "code": "{{handoffCode}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("names the code", function() {
          expect(Object.keys(res.body.errors)).to.include("Code");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Claimed by one guarded statement (specs/140): used, expired and made-up codes are the same 400.
