info:
  name: login admin
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{adminEmail}}",
        "password": "{{adminPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.status === 200) bru.setVar("adminToken", res.body.token);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Needs `adminEmail` / `adminPassword` in the environment - the values of `ADMIN_EMAIL` /
  `ADMIN_PASSWORD` in `server/.env`, seeded at Identity startup. They are marked secret, so Bruno
  stores them encrypted and does not write them into this file.
