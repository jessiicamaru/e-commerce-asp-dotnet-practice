info:
  name: login admin - the code
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login/two-factor"
  # Staff roles only in a back-office session (specs/138): Identity knows the app by the Origin of this request.
  headers:
    - name: Origin
      value: "{{backOfficeOrigin}}"
  body:
    type: json
    data: |-
      {
        "challenge": "{{adminChallenge}}",
        "code": "{{adminCode}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // The current code for a base32 TOTP secret (RFC 6238; specs/110) - what the authenticator app would show.
        // crypto-js and plain byte arrays: the CLI's safe-mode sandbox has no Node crypto and no Buffer.
        function totp(base32, offset) {
          const CryptoJS = require("crypto-js");
          const alphabet = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
          let bits = "";
          for (const c of base32.replace(/[\s=-]/g, "").toUpperCase()) bits += alphabet.indexOf(c).toString(2).padStart(5, "0");
          const key = bits.match(/.{8}/g).map(b => parseInt(b, 2));
          const step = Math.floor(Date.now() / 30000) + (offset || 0);
          const counter = [0, 0, 0, 0, (step >>> 24) & 255, (step >>> 16) & 255, (step >>> 8) & 255, step & 255];
          const words = bytes => {
            const out = [];
            for (let i = 0; i < bytes.length; i++) out[i >>> 2] = (out[i >>> 2] || 0) | (bytes[i] << (24 - (i % 4) * 8));
            return CryptoJS.lib.WordArray.create(out, bytes.length);
          };
          const hash = CryptoJS.HmacSHA1(words(counter), words(key));
          const h = [];
          for (let i = 0; i < hash.sigBytes; i++) h.push((hash.words[i >>> 2] >>> (24 - (i % 4) * 8)) & 255);
          const o = h[19] & 15;
          const n = ((h[o] & 127) * 16777216) + (h[o + 1] << 16) + (h[o + 2] << 8) + h[o + 3];
          return String(n % 1000000).padStart(6, "0");
        }
        const secret = bru.getEnvVar("adminTotpSecret") || bru.getVar("adminTotpSecret");
        if (!secret) throw new Error("adminTotpSecret is not set: pass ADMIN_TOTP_SECRET with --env-var \"adminTotpSecret=...\" (specs/110).");
        bru.setVar("adminCode", totp(secret, 0));
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status, "400 means the code was refused: either adminTotpSecret is not the server's ADMIN_TOTP_SECRET, or this collection signed the administrator in less than 30 seconds ago - a code works once; wait for the next window and run again").to.equal(200);
        });
        test("the session carries Admin, now that it was verified with a code - in the back office", function() {
          expect(res.body.roles).to.include("Admin");
          expect(res.body.staffAccount).to.equal(true);
          expect(res.body.token).to.be.a("string").and.not.equal("");
        });
        if (res.status === 200) bru.setVar("adminToken", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/110: the second step. The code is computed from `adminTotpSecret` - the value of `ADMIN_TOTP_SECRET`, which
  Identity seeds the administrator's authenticator with in development and CI only.
