info:
  name: forgot password is 202 for anybody
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/auth/forgot-password"
  body:
    type: json
    data: |-
      {
        "email": "nobody-{{$randomUUID}}@example.test"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 202 - the same as for a real account", function() {
          expect(res.status).to.equal(202);
        });
        test("the answer says nothing about the address", function() {
          expect(res.body || "").to.equal("");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/061 (#103). An address with an account gets the same 202 and an email; an address without one
  gets only the 202 - so this answer cannot tell anybody which emails exist (#28).
