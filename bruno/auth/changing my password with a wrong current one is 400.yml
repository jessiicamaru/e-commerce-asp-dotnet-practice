info:
  name: changing my password with a wrong current one is 400
  type: http
  seq: 11

http:
  method: PUT
  url: "{{baseUrl}}/api/auth/me/password"
  body:
    type: json
    data: |-
      {
        "currentPassword": "not-it",
        "newPassword": "Another-Passw0rd!"
      }
  auth:
    type: bearer
    token: "{{throwawayToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // A FRESH token: the change before this one revoked every access token issued before it (specs/065). The
        // registration's token passed only when both fell in the same second - revocation counts in whole
        // seconds - and was a 401 whenever they did not.
        const axios = require("axios");
        const signedIn = await axios.post(bru.interpolate("{{baseUrl}}/api/auth/login"),
          { email: bru.getVar("throwawayEmail"), password: "N3w-Passw0rd!bruno" });
        bru.setVar("throwawayToken", signedIn.data.token);
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("says so beside the field", function() {
          expect(((res.body.errors || {}).CurrentPassword || []).join(" ")).to.contain("not correct");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/064. A wrong current password changes nothing and counts toward the email's sign-in pause (specs/062).
