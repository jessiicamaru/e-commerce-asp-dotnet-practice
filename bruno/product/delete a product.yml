info:
  name: delete a product
  type: http
  seq: 19

http:
  method: DELETE
  url: "{{baseUrl}}/api/products/{{throwawayId}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 204", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Removes a product and every shape of it for good (specs/024). **Not the way to stop selling
  something** - that is deactivation, which leaves the row where a cart and a report can still find
  it. This is for rows that should never have existed, which is what ninety-four `E2E Widget …`
  products in the catalogue were.
