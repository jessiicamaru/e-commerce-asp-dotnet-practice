info:
  name: product in english falls back
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}"
  headers:
    - name: Accept-Language
      value: "en-GB,en;q=0.9"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("no English translation, so the text it was entered with - and language says which", function() {
          expect(res.headers["content-language"]).to.equal("en");
          expect(res.body.language).to.equal("vi");
          expect(res.body.name).to.not.equal("Máy ảnh Bruno");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Falling back is per FIELD, not per product: a product with a Vietnamese name and no Vietnamese
  description shows the Vietnamese name and the original description.
