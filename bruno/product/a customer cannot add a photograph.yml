  url: "{{baseUrl}}/api/products/{{productId}}/photos"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - fixtures/pixel.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{customerToken}}"

