info:
  name: the listing by ids
  type: http
  seq: 93

http:
  method: GET
  url: "{{baseUrl}}/api/products?ids={{productId}}&ids=00000000-0000-0000-0000-000000000001"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("only the products named that are on the shelf", function() {
          expect(res.body.items.map(p => p.id)).to.eql([bru.getVar("productId")]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/163: what a browser remembers having opened, read back. At most 24 ids.
