info:
  name: get a photograph
  type: http
  seq: 74

http:
  method: GET
  url: "{{baseUrl}}{{photoAUrl}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("an image, and nosniff", function() {
          expect(res.headers["content-type"]).to.equal("image/png");
          expect(res.headers["x-content-type-options"]).to.equal("nosniff");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/160: anyone, while the product is on sale; off the shelf only with the photograph's own `k`.
