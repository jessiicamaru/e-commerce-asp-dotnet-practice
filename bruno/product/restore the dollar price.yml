info:
  name: restore the dollar price
  type: http
  seq: 17

http:
  method: PUT
  url: "{{baseUrl}}/api/products/{{productId}}/variants/{{variantId}}/prices/USD"
  body:
    type: json
    data: |-
          {
            "amount": 1499
          }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Puts back what the previous two requests took away, so a re-run of the collection starts from the
  same place. Without this, the second run would find the variant unpriced and the checks would pass
  for the wrong reason.
