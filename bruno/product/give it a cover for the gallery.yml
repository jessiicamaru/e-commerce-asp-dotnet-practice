info:
  name: give it a cover for the gallery
  type: http
  seq: 71

http:
  method: PUT
  url: "{{baseUrl}}/api/products/{{productId}}/image"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - fixtures/pixel.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.imageUrl) bru.setVar("coverUrl", res.body.imageUrl);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/160: the gallery starts from a cover, so the photographs that follow go after it.
