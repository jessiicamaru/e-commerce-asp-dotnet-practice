info:
  name: get all products
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseUrl}}/api/products?pageNumber=1&pageSize=10"
  params:
    - name: pageNumber
      value: "1"
      type: query
    - name: pageSize
      value: "10"
      type: query
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Optional query parameters: `categoryId`, `searchTerm`, `sortBy`.

  `availability` is `InStock` / `OutOfStock`, never a count - it is a read model fed by
  Inventory's events and seconds behind by design. The real number is `GET /api/stock/{productId}`.
