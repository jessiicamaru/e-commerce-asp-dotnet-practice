info:
  name: a reversed price range is 400
  type: http
  seq: 70

http:
  method: GET
  url: "{{baseUrl}}/api/products?minPrice=5&maxPrice=1"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("it says which way round", function() {
          expect(JSON.stringify(res.body.errors)).to.contain("The minimum price is above the maximum.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/109: a reversed range is a mistake better said than answered with an empty page.

