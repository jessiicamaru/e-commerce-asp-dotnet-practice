info:
  name: search suggestions
  type: http
  seq: 94

http:
  method: GET
  url: "{{baseUrl}}/api/products/suggest?q={{runId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a few products and categories, this product among them", function() {
          expect(res.body.products.length).to.be.at.most(6);
          expect(res.body.categories.length).to.be.at.most(4);
          expect(res.body.products.map(p => p.id)).to.include(bru.getVar("productId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/164: anonymous and cached. Products through the catalogue's own search (no diacritics needed), and categories.
