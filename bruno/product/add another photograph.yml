info:
  name: add another photograph
  type: http
  seq: 73

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/photos"
  body:
    type: multipart-form
    data:
      - name: file
        type: file
        value:
          - fixtures/pixel.png
        contentType: image/png
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.photos) bru.setVar("photoB", res.body.photos[1].id);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("in the order added", function() {
          expect(res.body.photos.map(p => p.id)[0]).to.equal(bru.getVar("photoA"));
          expect(res.body.photos).to.have.length(2);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  
