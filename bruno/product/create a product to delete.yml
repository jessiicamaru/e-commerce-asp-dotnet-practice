info:
  name: create a product to delete
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/api/products"
  body:
    type: json
    data: |-
        {
          "name": "Throwaway {{throwawaySku}}",
          "description": "created so the next request has something to delete",
          "price": 100000,
          "sku": "{{throwawaySku}}",
          "categoryId": "{{categoryId}}"
        }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("throwawaySku", "BRUNO-DEL-" + Date.now());
    - type: after-response
      code: |-
        if (res.body && res.body.id) bru.setVar("throwawayId", res.body.id);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A product that exists only to be deleted by the next request. Deleting the collection's main
  `productId` would take the rest of the run down with it.
