info:
  name: make a photograph the cover
  type: http
  seq: 78

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{productId}}/photos/{{photoA}}/cover"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a new cover, and the old one in its place", function() {
          expect(res.body.imageUrl).to.not.equal(bru.getVar("coverUrl"));
          expect(res.body.photos).to.have.length(2);
          expect(res.body.photos[0].id).to.equal(bru.getVar("photoB"));
          expect(res.body.photos[1].id).to.not.equal(bru.getVar("photoA"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/160: its bytes become the cover; the previous cover takes its place in the gallery.
