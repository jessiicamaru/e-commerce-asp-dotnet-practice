info:
  name: product in dollars
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}?currency=USD"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("priced in dollars, and says so", function() {
          expect(res.headers["x-currency"]).to.equal("USD");
          expect(res.body.currency).to.equal("USD");
        });
        test("the dollar price is the one that was set, not a conversion of the dong one", function() {
          var variant = res.body.variants.find(function(v) { return v.id === bru.getVar("variantId"); });
          expect(variant.price).to.equal(1499);
          expect(variant.price).to.not.equal(129000);
        });
        test("and says the answer depends on being asked, so a cache cannot mix them up", function() {
          expect(String(res.headers["vary"])).to.contain("X-Currency");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The same URL as `get product by id`, asked in dollars. `Vary: X-Currency` is what stops a cache
  handing these prices to somebody shopping in dong - the worst cache entry in the shop to get wrong.
