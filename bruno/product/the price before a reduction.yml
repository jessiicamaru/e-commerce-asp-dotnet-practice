info:
  name: the price before a reduction
  type: http
  seq: 82

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}?currency=VND"
  auth:
    type: none

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.variants) {
          // The shape the card shows: the cheapest active one priced in dong (specs/161 research D4).
          const v = res.body.variants.filter(x => x.isActive && x.price !== null).sort((a, b) => a.price - b.price)[0];
          bru.setVar("saleVariantId", v.id);
          bru.setVar("salePrice", v.price);
          bru.setVar("wasPrice", v.price * 2);
        }
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("not reduced yet", function() {
          expect(res.body.compareAtPrice).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/161: the variant and its price in dong, to compare against.
