info:
  name: an unpriced variant has no price at all
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}?currency=USD"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("no price, rather than the other currency's number or a converted one", function() {
          var variant = res.body.variants.find(function(v) { return v.id === bru.getVar("variantId"); });
          expect(variant.price).to.equal(null);
          expect(variant.price).to.not.equal(129000);
          expect(variant.price).to.not.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The heart of specs/022, and the one place it differs from the translations beside it. A missing
  translation falls back and the worst case is a shopper reading English. A missing price must NOT:
  the two ways that goes wrong are selling a 40,000,000 VND camera for 1,600 VND and charging
  40,000,000 USD for it. Zero is excluded explicitly - zero is a price, and it is a free camera.
