info:
  name: only what is in stock
  type: http
  seq: 69

http:
  method: GET
  url: "{{baseUrl}}/api/products?inStock=true&pageSize=50"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("nothing out of stock is listed", function() {
          res.body.items.forEach(function(p) { expect(p.availability).to.equal("InStock"); });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/109: the availability read model - for display, like the card's badge.

