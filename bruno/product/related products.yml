info:
  name: related products
  type: http
  seq: 90

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{productId}}/related"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("cards like the listing, at most 8, never the product itself", function() {
          expect(res.body).to.be.an("array");
          expect(res.body.length).to.be.at.most(8);
          expect(res.body.map(p => p.id)).to.not.include(bru.getVar("productId"));
          res.body.forEach(p => expect(p).to.have.property("availability"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/163: anonymous and cached. Its category first, then its department, most reviewed first. Empty for an unknown or off-shelf product.
