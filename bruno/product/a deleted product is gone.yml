info:
  name: a deleted product is gone
  type: http
  seq: 20

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{throwawayId}}"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404", function() {
          expect(res.status).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Gone, not deactivated. A deactivated product still answers here with `isActive: false`.
