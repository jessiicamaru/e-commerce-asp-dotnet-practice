    data: |-
      {
        "code": "CUSTOMER-TRY",
        "name": "Mine",
        "benefit": "Percent",
        "percent": 90,
        "amounts": [{ "currency": "VND" }]
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

