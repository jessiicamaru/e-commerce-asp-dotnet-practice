info:
  name: a customer cannot edit a voucher
  type: http
  seq: 70

http:
  method: PUT
  url: "{{baseUrl}}/api/vouchers/{{sellerVoucherId}}"
  body:
    type: json
    data: |-
      {
        "name": "Mine now"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Administrators and sellers manage vouchers (specs/113).
