info:
  name: the shop page is public
  type: http
  seq: 93

http:
  method: GET
  url: "{{baseUrl}}/api/shops/{{sellerId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // Catalog learns the description by message (specs/099): give the broker a moment.
        await new Promise(function(resolve) { setTimeout(resolve, 2000); });
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("it carries the shop's name and words", function() {
          expect(res.body.sellerId).to.equal(bru.getVar("sellerId"));
          expect(res.body.shopName).to.equal("Bruno Cameras");
          expect(res.body.description).to.equal("Used Fujifilm bodies, tested by Bruno.");
        });
        test("its rating is the one its seller's insights show (specs/165)", function() {
          expect(res.body).to.include.keys("ratingAverage", "ratingCount");
          expect(res.body.ratingCount).to.be.at.least(0);
          if (res.body.ratingCount === 0) expect(res.body.ratingAverage).to.equal(null);
          expect(JSON.stringify([res.body.ratingAverage, res.body.ratingCount])).to.equal(bru.getVar("insightsRating"));
        });
        bru.setVar("shopProductCount", res.body.productCount);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/099: anybody reads a shop's page, signed in or not. The name and words are Catalog's read
  model, so this costs no call to Identity - and is eventually consistent. Since specs/165 it carries the
  shop's rating, computed by the same code as the seller's insights (`ShopRatingTests`).
