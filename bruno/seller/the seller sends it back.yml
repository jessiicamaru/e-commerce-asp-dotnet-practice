info:
  name: the seller sends it back
  type: http
  seq: 54

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{sellerProductId}}/resubmit"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("pending again, the old reason gone", function() {
          expect(res.body.reviewStatus).to.equal("Pending");
          expect(res.body.reviewReason).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Back in the queue.
