info:
  name: the stock read carries the line
  type: http
  seq: 96

http:
  method: GET
  url: "{{baseUrl}}/api/stock/{{sellerProductId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the line set a moment ago", function() {
          expect(res.body.lowStockThreshold).to.equal(10);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
