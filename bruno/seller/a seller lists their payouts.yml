info:
  name: a seller lists their payouts
  type: http
  seq: 37

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales/payouts?page=1&pageSize=12"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a page of payouts", function() {
          expect(res.body.items).to.be.an("array");
          expect(res.body.page).to.equal(1);
          expect(res.body.totalCount).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The payouts the shop has recorded for this seller, newest first (specs/037). Payment is a stub: a
  payout is the ledger entry, not a transfer.
