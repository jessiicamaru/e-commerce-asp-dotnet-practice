info:
  name: a hidden answer cannot be rewritten is 409
  type: http
  seq: 75

http:
  method: PUT
  url: "{{baseUrl}}/api/questions/{{questionId}}/answer"
  body:
    type: json
    data: |-
      {
        "answer": "The same again."
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Locked until staff show it again - otherwise hiding would last until the next edit.
