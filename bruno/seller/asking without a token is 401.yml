info:
  name: asking without a token is 401
  type: http
  seq: 77

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{sellerProductId}}/questions"
  body:
    type: json
    data: |-
      {
        "body": "Anyone?"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 401", function() {
          expect(res.status).to.equal(401);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A question is signed by somebody; without a token there is nobody.
