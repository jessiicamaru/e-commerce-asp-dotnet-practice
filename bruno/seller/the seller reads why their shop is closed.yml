info:
  name: the seller reads why their shop is closed
  type: http
  seq: 107

http:
  method: GET
  url: "{{baseUrl}}/api/shops/mine"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the state and the reason", function() {
          expect(res.body.state).to.equal("Closed");
          expect(res.body.closedReason).to.equal("Checked by Bruno");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: what /shop shows the seller.

