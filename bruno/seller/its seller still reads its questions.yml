info:
  name: its seller still reads its questions
  type: http
  seq: 81

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{sellerProductId}}/questions"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the question asked earlier in this folder", function() {
          expect(res.body.items.map(q => q.id)).to.include(bru.getVar("questionId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Its seller and staff still see what is said about it, as they still see the product.
