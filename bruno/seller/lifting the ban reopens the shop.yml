info:
  name: lifting the ban reopens the shop
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{sellerId}}/unban"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
