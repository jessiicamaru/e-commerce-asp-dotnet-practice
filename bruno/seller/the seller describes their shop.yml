info:
  name: the seller describes their shop
  type: http
  seq: 86

http:
  method: PUT
  url: "{{baseUrl}}/api/sellers/me/description"
  body:
    type: json
    data: |-
      {
        "description": "  Used Fujifilm bodies, tested by Bruno.  "
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the words are stored trimmed", function() {
          expect(res.body.description).to.equal("Used Fujifilm bodies, tested by Bruno.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/099: the seller's own words for their shop's page. Who is describing comes from the token -
  there is no seller id in the address. Saving it empty clears it.
