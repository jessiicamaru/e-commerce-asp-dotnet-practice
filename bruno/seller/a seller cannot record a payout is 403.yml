info:
  name: a seller cannot record a payout is 403
  type: http
  seq: 20

http:
  method: POST
  url: "{{baseUrl}}/api/orders/payouts"
  body:
    type: json
    data: |-
      {
        "sellerId": "{{sellerId}}",
        "currency": "VND"
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  `[Authorize(Roles = "Admin")]` (specs/037). A seller settling their own balance is the one request this
  endpoint exists to refuse, and no unit test sees the attribute. Here rather than in `security-checks`
  because it needs `sellerToken`, set in this folder.
