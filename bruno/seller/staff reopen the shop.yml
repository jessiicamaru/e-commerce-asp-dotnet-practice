info:
  name: staff reopen the shop
  type: http
  seq: 109

http:
  method: POST
  url: "{{baseUrl}}/api/shops/{{sellerId}}/reopen"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop is open", function() {
          expect(res.body.state).to.equal("Open");
          expect(res.body.closedReason).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: staff reopening leaves a seller's own pause alone - here there is none, so the shop is open.

