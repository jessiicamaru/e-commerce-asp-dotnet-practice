info:
  name: staff see it in the review queue
  type: http
  seq: 16

http:
  method: GET
  url: "{{baseUrl}}/api/products/review?status=Pending&pageSize=50"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("this product, with its shop", function() {
          var ours = res.body.items.filter(function(p) { return p.id === bru.getVar("sellerProductId"); });
          expect(ours).to.have.length(1);
          expect(ours[0].sellerName).to.equal("Bruno Cameras");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The queue, oldest submission first.
