info:
  name: a seller cannot ship a part that is not theirs
  type: http
  seq: 35

http:
  method: POST
  url: "{{baseUrl}}/api/orders/sales/{{orderId}}/preparing"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // `orderId` is the customer's real order from the order folder, holding only the SHOP's goods.
        // This seller has no part of it, so there is nothing of theirs to prepare.
        test("status 404, not 403", function() {
          expect(res.status).to.equal(404);
        });
        test("worded exactly like a sale that does not exist", function() {
          expect(res.body.detail).to.equal("Sale not found.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/035: a seller moves THEIR part of an order and nothing else. Another seller's part, the
  shop's, an order that does not exist - one 404, in the words specs/034 chose, so the refusal cannot
  confirm the order exists or that somebody else sold something on it.
