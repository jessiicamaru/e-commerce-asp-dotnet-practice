info:
  name: the seller confirms their email with the link
  type: http
  seq: 7

http:
  method: POST
  url: "{{baseUrl}}/api/auth/confirm-email"
  body:
    type: json
    data: |-
      {
        "token": "{{confirmationToken}}"
      }
  auth:
    type: none

runtime:
  scripts:
    - type: before-request
      code: |-
        // The link is read from the email, the way a person would: Mailpit (http://localhost:8025) keeps
        // every email the stack sends. The dispatcher sends every 15 seconds, so wait up to 40 for it.
        const axios = require("axios");
        const mailpit = bru.interpolate("{{mailpitUrl}}");
        const email = bru.getVar("sellerEmail");
        let token = null;
        for (let i = 0; i < 40 && !token; i++) {
          const found = await axios.get(mailpit + "/api/v1/search?query=" + encodeURIComponent("to:" + email));
          const message = (found.data.messages || [])[0];
          if (message) {
            const full = await axios.get(mailpit + "/api/v1/message/" + message.ID);
            const link = /confirm-email\?token=([^\s]+)/.exec(full.data.Text || "");
            if (link) token = decodeURIComponent(link[1]);
          }
          if (!token) await bru.sleep(1000);
        }
        bru.setVar("confirmationToken", token || "no-email-arrived");
    - type: tests
      code: |-
        test("the email arrived with a link", function() {
          expect(bru.getVar("confirmationToken")).to.not.equal("no-email-arrived");
        });
        test("status 204 - confirmed", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/063 (#106). Anonymous: the link may be opened in another browser. The token is 32 random bytes; only
  its SHA-256 hash is stored, and the sent email's row keeps no copy. Needs Mailpit - it is part of
  `docker compose up -d`.
