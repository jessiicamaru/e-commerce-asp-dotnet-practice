info:
  name: editing a disabled voucher is 409
  type: http
  seq: 71

http:
  method: PUT
  url: "{{baseUrl}}/api/vouchers/{{sellerVoucherId}}"
  body:
    type: json
    data: |-
      {
        "name": "Too late"
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A disabled voucher stays disabled and is not edited (specs/113).
