info:
  name: the shop page lists only what is on its shelf
  type: http
  seq: 94

http:
  method: GET
  url: "{{baseUrl}}/api/products?sellerId={{sellerId}}&pageSize=50"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("every product is this shop's", function() {
          res.body.items.forEach(function(p) { expect(p.sellerId).to.equal(bru.getVar("sellerId")); });
        });
        test("the product taken down is not on the page", function() {
          expect(res.body.items.map(function(p) { return p.id; })).to.not.include(bru.getVar("sellerProductId"));
        });
        test("the count on the page agrees with the listing", function() {
          expect(res.body.totalCount).to.equal(bru.getVar("shopProductCount"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/099: the shop's products are the public listing with a `sellerId` - the same shelf rule as the
  catalogue, so a product a moderator took down (seq 81) is not here.
