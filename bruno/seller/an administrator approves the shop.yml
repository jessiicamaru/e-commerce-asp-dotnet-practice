info:
  name: an administrator approves the shop
  type: http
  seq: 6

http:
  method: POST
  url: "{{baseUrl}}/api/shop-applications/{{applicationId}}/approve"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("approved", function() {
          expect(res.body.status).to.equal("Approved");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Approval grants Seller, opens the shop and tells Catalog (SellerRegisteredEvent) - in one transaction with
  the decision, so none of it can happen twice.
