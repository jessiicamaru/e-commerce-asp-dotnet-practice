info:
  name: a customer asks the seller a question
  type: http
  seq: 68

http:
  method: POST
  url: "{{baseUrl}}/api/products/{{sellerProductId}}/questions"
  body:
    type: json
    data: |-
      {
        "body": "Does it come with the charger?"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.id) bru.setVar("questionId", res.body.id);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("signed from the token, not answered yet", function() {
          expect(res.body.askerName).to.be.a("string").and.not.equal("");
          expect(res.body.answer).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Questions (specs/076, #110): any signed-in customer, about a product on sale. The seller is notified.
