info:
  name: the shop page says a paused shop is away
  type: http
  seq: 96

http:
  method: GET
  url: "{{baseUrl}}/api/shops/{{sellerId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200 - a paused shop is still a page", function() {
          expect(res.status).to.equal(200);
        });
        test("it says it is paused, with nothing on the shelf", function() {
          expect(res.body.paused).to.equal(true);
          expect(res.body.productCount).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: a shopper following a link to a shop on holiday learns it is away, not that it vanished.

