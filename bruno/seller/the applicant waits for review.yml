info:
  name: the applicant waits for review
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/shop-applications/mine"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("one application, pending, under the shop name", function() {
          expect(res.body).to.have.length(1);
          expect(res.body[0].status).to.equal("Pending");
          expect(res.body[0].shopName).to.equal("Bruno Cameras");
        });
        if (res.status === 200 && res.body.length) bru.setVar("applicationId", res.body[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/044: registering to sell opens an account and an application - not a shop. Their own applications,
  newest first; no id in the address, the token says whose.
