info:
  name: staff see what they decided
  type: http
  seq: 50

http:
  method: GET
  url: "{{baseUrl}}/api/audit/mine?pageSize=50"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the approval of this product is among them", function() {
          var ours = res.body.items.filter(function(e) {
            return e.action === "ProductApproved" && e.subjectId === bru.getVar("sellerProductId");
          });
          expect(ours).to.have.length(1);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The moderator dashboard's "recently": Moderation entries the caller is the actor of (specs/045).
