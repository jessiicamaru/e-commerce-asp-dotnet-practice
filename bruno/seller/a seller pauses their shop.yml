info:
  name: a seller pauses their shop
  type: http
  seq: 99

http:
  method: POST
  url: "{{baseUrl}}/api/shops/mine/pause"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop is paused", function() {
          expect(res.body.state).to.equal("Paused");
          expect(res.body.pausedAt).to.be.a("string");
          expect(res.body.sellerId).to.equal(bru.getVar("sellerId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: a seller going away takes their whole shop off the shelf. No seller id in the request - the token says whose.

