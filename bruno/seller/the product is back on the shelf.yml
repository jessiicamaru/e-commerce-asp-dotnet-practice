info:
  name: the product is back on the shelf
  type: http
  seq: 21

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{sellerProductId}}"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Catalog learns of the ban by message (specs/095 D2): give the broker a moment.
        await new Promise(function(resolve) { setTimeout(resolve, 2000); });
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Approved before the ban, so on sale again once the shop reopens.
