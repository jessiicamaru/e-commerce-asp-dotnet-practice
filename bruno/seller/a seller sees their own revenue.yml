info:
  name: a seller sees their own revenue
  type: http
  seq: 56

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales/insights/revenue"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the admin's shape: totals per currency and days, over whole days", function() {
          expect(res.body).to.have.all.keys("from", "to", "totals", "days", "firstDay", "lastDay");
          res.body.totals.forEach(function(t) {
            expect(t).to.have.all.keys("currency", "revenue", "orders", "averageOrderValue");
          });
        });
        test("the shop's days (specs/082): 30 of them, starting at midnight in Hanoi", function() {
          var day = 86400000;
          expect((Date.parse(res.body.lastDay) - Date.parse(res.body.firstDay)) / day + 1).to.equal(30);
          // Asia/Ho_Chi_Minh is UTC+7 with no daylight saving: its midnight is 17:00 UTC the day before.
          expect(Date.parse(res.body.from) + 7 * 3600000).to.equal(Date.parse(res.body.firstDay));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A seller's own revenue (specs/068): their lines on sold orders, before tax, per currency - never an order's
  total, and not a parcel returned and refunded. No seller id anywhere: the token says whose. Empty for the
  seller registered in this folder, who has sold nothing; `SellerInsightsTests` proves the numbers.
