info:
  name: the shop name reaches the catalogue
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/products/{{sellerProductId}}"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a shopper is told which shop sells it", function() {
          expect(res.body.sellerName).to.equal("Bruno Cameras");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The name is Catalog's own read model, fed by `SellerRegisteredEvent` - which is why this page costs
  no call to Identity, and why an anonymous read keeps working with Identity switched off.

  ⚠️ It is eventually consistent. If this test is ever flaky, that is what it is telling you: the
  event had not arrived yet, not that the name is wrong.
