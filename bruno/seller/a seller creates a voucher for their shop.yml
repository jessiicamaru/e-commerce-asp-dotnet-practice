info:
  name: a seller creates a voucher for their shop
  type: http
  seq: 60

http:
  method: POST
  url: "{{baseUrl}}/api/vouchers"
  body:
    type: json
    data: |-
      {
        "code": "{{sellerVoucherCode}}",
        "name": "Bruno shop voucher",
        "benefit": "FixedAmount",
        "amounts": [{ "currency": "VND", "fixedValue": 50000 }],
        "targets": [{ "type": "Product", "id": "{{sellerProductId}}" }],
        "conditions": [{ "type": "FirstOrderInShop" }]
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        bru.setVar("sellerVoucherCode", "SHOP-" + Date.now());
    - type: after-response
      code: |-
        if (res.body && res.body.id) bru.setVar("sellerVoucherId", res.body.id);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop's own, not the platform's", function() {
          expect(res.body.isPlatform).to.equal(false);
          expect(res.body.targets[0].id).to.equal(bru.getVar("sellerProductId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A seller's voucher is their shop's (specs/069): it touches only their lines, and they pay for it - it comes out of
  their payout. This one is 50,000 VND off the product this folder listed.
