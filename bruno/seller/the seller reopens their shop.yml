info:
  name: the seller reopens their shop
  type: http
  seq: 104

http:
  method: POST
  url: "{{baseUrl}}/api/shops/mine/reopen"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop is open again", function() {
          expect(res.body.state).to.equal("Open");
          expect(res.body.pausedAt).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: reopening puts back everything that was on sale, and tells whoever saved one of those products.

