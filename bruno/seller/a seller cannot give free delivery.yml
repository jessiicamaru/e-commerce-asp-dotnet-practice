      {
        "code": "SHIP-{{sellerVoucherCode}}",
        "name": "Free delivery",
        "benefit": "FreeShipping",
        "amounts": [{ "currency": "VND" }]
      }
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
