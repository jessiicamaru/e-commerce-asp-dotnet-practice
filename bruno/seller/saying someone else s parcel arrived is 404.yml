  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Not their order: not found, in the words used for none at all (specs/040). Saying a stranger's parcel
  arrived would release a seller's money on a stranger's word. Here because it needs `sellerToken`.
