info:
  name: a seller lists their sales
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales?page=1&pageSize=20"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a page, even when nothing has sold yet", function() {
          expect(res.body.items).to.be.an("array");
          expect(res.body.page).to.equal(1);
          expect(res.body.totalCount).to.be.a("number");
        });
        // What a seller must NOT be told (specs/034 research D4). Empty on a fresh seller, so the
        // check is on whatever rows there are - and on the shape, which the unit tests also pin.
        test("no row carries the order total or the customer", function() {
          res.body.items.forEach(function(sale) {
            expect(sale).to.not.have.property("totalAmount");
            expect(sale).to.not.have.property("userId");
            expect(sale).to.have.property("subtotal");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The seller's sales (specs/034): paid orders holding at least one of their lines, figures over
  those lines only. No seller id anywhere in the request - the token says whose.

  The seller registered in this folder has sold nothing, so this proves the route, the role and the
  shape. That a real purchase shows up here is proven end to end on a running stack (see
  specs/034-seller-sales/quickstart.md) and by `SellerSalesTests`.
