info:
  name: anybody sees the shops public voucher
  type: http
  seq: 66

http:
  method: GET
  url: "{{baseUrl}}/api/vouchers/public?sellerId={{sellerId}}"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop's voucher is listed, with no limit or count", function() {
          var mine = res.body.filter(function (v) { return v.code === bru.getVar("sellerVoucherCode"); });
          expect(mine).to.have.length(1);
          expect(mine[0].sellerId).to.equal(bru.getVar("sellerId"));
          expect(mine[0]).to.not.have.property("usedCount");
          expect(mine[0]).to.not.have.property("totalLimit");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/114 (#220). Without a token: showing a voucher is not a secret. Private ones never appear.
