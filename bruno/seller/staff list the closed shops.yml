info:
  name: staff list the closed shops
  type: http
  seq: 110

http:
  method: GET
  url: "{{baseUrl}}/api/shops/closed?pageSize=50"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the shop is on the list", function() {
          expect(res.body.items.map(function(s) { return s.sellerId; })).to.include(bru.getVar("sellerId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: the Closed shops tab of /admin/shops.

