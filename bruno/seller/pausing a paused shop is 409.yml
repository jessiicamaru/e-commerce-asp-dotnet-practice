info:
  name: pausing a paused shop is 409
  type: http
  seq: 101

http:
  method: POST
  url: "{{baseUrl}}/api/shops/mine/pause"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 409", function() {
          expect(res.status).to.equal(409);
        });
        test("it says why", function() {
          expect(res.body.detail).to.equal("The shop is already paused.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/107: one guarded UPDATE; a second pause changes nothing.

