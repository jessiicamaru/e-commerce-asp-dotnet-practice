info:
  name: an order that is not their sale is 404
  type: http
  seq: 14

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales/{{orderId}}"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // `orderId` is the customer's order from the order folder: it EXISTS, and holds only the
        // shop's product. That is what makes this worth running - a missing id would 404 anyway.
        test("the order id is a real one", function() {
          expect(bru.getVar("orderId")).to.match(/^[0-9a-f-]{36}$/);
        });
        test("status 404, not 403", function() {
          expect(res.status).to.equal(404);
        });
        test("worded exactly like an order that does not exist", function() {
          expect(res.body.detail).to.equal("Sale not found.");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/034 research D5: an order that exists but is not this seller's sale is refused in the same
  words as one that does not exist. A 403, or a different sentence, would confirm that the id is
  real and that somebody else sold something on it.

  Here rather than in `security-checks` because it needs `sellerToken`, set in this folder, and
  folders run in name order.
