info:
  name: an unknown sales state is 400
  type: http
  seq: 120

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales?status=Delivered"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("says which field", function() {
          expect(JSON.stringify(res.body.errors)).to.contain("Status");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Paid, Preparing, Shipped or Cancelled (specs/131).
