info:
  name: a seller lists the returns of their parcels
  type: http
  seq: 113

http:
  method: GET
  url: "{{baseUrl}}/api/orders/sales/returns?status=Requested&pageSize=50"
  auth:
    type: bearer
    token: "{{sellerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a page of returns, none of them the shop's own", function() {
          expect(res.body.items).to.be.an("array");
          expect(res.body.totalCount).to.be.a("number");
          res.body.items.forEach(function(r) {
            expect(r.isShop).to.equal(false);
            expect(r.status).to.equal("Requested");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/108: the returns of the caller's own parcels, oldest waiting first. That no other seller's return appears is
  proved in Ecommerce.Order.Tests/ReturnTests; this run's seller has no delivered parcel to return.

