info:
  name: anyone reads the category specifications
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/categories/{{categoryId}}/specifications?lang=en"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
          expect(res.body.map(s => s.id)).to.include(bru.getVar("specificationId"));
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/159: anonymous, cached like the other catalogue reads (specs/157).
