info:
  name: an administrator locks it for 300 days
  type: http
  seq: 18

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{longLockId}}/lock"
  body:
    type: json
    data: |-
      {
        "days": 300,
        "reason": "An administrator decided"
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        if (res.status === 200) bru.setVar("longLockUntil", res.body.lockedUntil);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Longer than a moderator's 30 days (specs/043), so only an administrator may shorten or lift it.
