info:
  name: the moderator signs in without the role until two-factor
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{modEmail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("told to set up two-factor sign-in, and holding no Moderator until then", function() {
          expect(res.body.twoFactor).to.equal("SetupRequired");
          expect(res.body.roles).to.not.include("Moderator");
        });
        if (res.status === 200) bru.setVar("modToken", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The grant, read back from the account on the next sign-in - and, since specs/110, withheld from the session until
  the moderator sets up two-factor sign-in.
