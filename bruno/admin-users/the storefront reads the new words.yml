info:
  name: the storefront reads the new words
  type: http
  seq: 29

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/wording"
  auth:
    type: none

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("in English only", function() {
          expect(res.body.en.NewSale).to.equal("A <strong>new sale</strong>: {{order}}");
          expect(res.body.vi.NewSale).to.equal(undefined);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  What every reader's bell says on their next load - no storefront release.
