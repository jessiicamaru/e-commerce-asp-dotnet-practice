info:
  name: register an account for a long lock
  type: http
  seq: 17

http:
  method: POST
  url: "{{baseUrl}}/api/auth/register"
  body:
    type: json
    data: |-
      {
        "email": "{{longLockEmail}}",
        "password": "{{customerPassword}}",
        "firstName": "Bruno",
        "lastName": "Locked"
      }
  auth: inherit

runtime:
  scripts:
    - type: before-request
      code: |-
        // Its own person: the lock below ends every session, and the rest of the collection needs the customer's.
        bru.setVar("longLockEmail", "bruno-locked+" + Date.now() + "@example.test");
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        if (res.status === 200) bru.setVar("longLockId", res.body.id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  specs/088 (#180): somebody an administrator locks for longer than a moderator could.
