info:
  name: an administrator resets the notice
  type: http
  seq: 30

http:
  method: POST
  url: "{{baseUrl}}/api/notifications/wording/NewSale/en/reset"
  body:
    type: json
    data: |-
      {
        "expectedVersion": {{wordingVersion}}
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the storefront's own words again", function() {
          expect(res.body.isDefault).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Leaves the shop's notices as they were before this run; the edit stays in the history.
