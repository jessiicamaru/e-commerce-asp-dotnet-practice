info:
  name: the moderator signs in holding the role
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{modEmail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("roles include Moderator", function() {
          expect(res.body.roles).to.include("Moderator");
        });
        if (res.status === 200) bru.setVar("modToken", res.body.token);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The grant, read back from the account on the next sign-in.
