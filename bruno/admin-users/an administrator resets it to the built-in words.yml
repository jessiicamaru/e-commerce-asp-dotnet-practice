info:
  name: an administrator resets it to the built-in words
  type: http
  seq: 23

http:
  method: POST
  url: "{{baseUrl}}/api/email-templates/OrderPaid/en/reset"
  body:
    type: json
    data: |-
      {
        "expectedVersion": {{emailVersion}}
      }
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the built-in words again, as a new version", function() {
          expect(res.body.isDefault).to.equal(true);
          expect(res.body.subject).to.equal("Your order {order} is paid");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Leaves the shop's emails as they were before this run - and the edit above is still in the history.
