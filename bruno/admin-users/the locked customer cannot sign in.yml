info:
  name: the locked customer cannot sign in
  type: http
  seq: 10

http:
  method: POST
  url: "{{baseUrl}}/api/auth/login"
  body:
    type: json
    data: |-
      {
        "email": "{{customerEmail}}",
        "password": "{{customerPassword}}"
      }
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });
        test("told why, since the password was right", function() {
          expect(res.body.detail).to.contain("Bruno checks the lock");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  403 with the reason only after the right password (specs/043). A wrong one is still the plain 401 that
  reveals nothing about the account.
