info:
  name: a moderator cannot ban
  type: http
  seq: 11

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{customerId}}/ban"
  body:
    type: json
    data: |-
      {
        "reason": "Not for a moderator"
      }
  auth:
    type: bearer
    token: "{{modToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 403", function() {
          expect(res.status).to.equal(403);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Only an administrator bans (specs/043).
