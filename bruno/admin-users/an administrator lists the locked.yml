info:
  name: an administrator lists the locked
  type: http
  seq: 41

http:
  method: GET
  url: "{{baseUrl}}/api/users?state=Locked&search={{longLockEmail}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the account locked for 300 days", function() {
          expect(res.body.items.map(u => u.id)).to.deep.equal([bru.getVar("longLockId")]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  By state (specs/133, #249): locked is a lock still running, never a ban.
