info:
  name: a moderator finds the customer
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/users?search={{customerEmail}}"
  auth:
    type: bearer
    token: "{{modToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("one person", function() {
          expect(res.body.items).to.have.length(1);
        });
        if (res.status === 200 && res.body.items.length) bru.setVar("customerId", res.body.items[0].id);

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  A moderator looks people up too - to lock them.
