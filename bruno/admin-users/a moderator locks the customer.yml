info:
  name: a moderator locks the customer
  type: http
  seq: 9

http:
  method: POST
  url: "{{baseUrl}}/api/users/{{customerId}}/lock"
  body:
    type: json
    data: |-
      {
        "days": 3,
        "reason": "Bruno checks the lock"
      }
  auth:
    type: bearer
    token: "{{modToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("locked until a date, with the reason", function() {
          expect(res.body.lockedUntil).to.be.a("string");
          expect(res.body.lockReason).to.equal("Bruno checks the lock");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Every session of the account ends now; signing in is refused until the date or an unlock.
