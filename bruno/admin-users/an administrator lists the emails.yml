info:
  name: an administrator lists the emails
  type: http
  seq: 18

http:
  method: GET
  url: "{{baseUrl}}/api/email-templates"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        const paid = res.body && res.body.find ? res.body.find(e => e.template === "OrderPaid" && e.language === "en") : null;
        if (paid) bru.setVar("emailVersion", paid.version);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("eleven emails in two languages, each with what it may use", function() {
          expect(res.body).to.have.length(22);
          const reset = res.body.find(e => e.template === "PasswordReset" && e.language === "en");
          expect(reset.required).to.include("link");
        });
        test("the emails of specs/083 are listed and editable, in both languages", function() {
          ["ParcelShipped", "OrderCancelled", "ReturnAccepted", "ReturnRefused", "ReturnRefunded",
           "SavedBackInStock", "AccountLocked", "AccountBanned"].forEach(function(name) {
            ["vi", "en"].forEach(function(language) {
              expect(res.body.some(e => e.template === name && e.language === language), name + " " + language).to.equal(true);
            });
          });
          const shipped = res.body.find(e => e.template === "ParcelShipped" && e.language === "en");
          expect(shipped.placeholders).to.include.members(["shop", "tracking"]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Each as it currently reads - an administrator's version or the built-in words.
