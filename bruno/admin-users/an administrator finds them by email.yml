info:
  name: an administrator finds them by email
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/users?search={{modEmail}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("exactly that person, not locked or banned", function() {
          expect(res.body.items).to.have.length(1);
          var u = res.body.items[0];
          expect(u.id).to.equal(bru.getVar("modId"));
          expect(u.lockedUntil).to.equal(null);
          expect(u.bannedAt).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Staff search people by part of an email or a name (specs/043). The admin console's Users page.
