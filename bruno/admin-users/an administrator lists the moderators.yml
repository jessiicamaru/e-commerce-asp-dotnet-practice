info:
  name: an administrator lists the moderators
  type: http
  seq: 43

http:
  method: GET
  url: "{{baseUrl}}/api/users?role=Moderator&search={{modEmail}}"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the moderator granted earlier", function() {
          expect(res.body.items.map(u => u.id)).to.deep.equal([bru.getVar("modId")]);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  By role (specs/133, #249).
