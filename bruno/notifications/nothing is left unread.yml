info:
  name: nothing is left unread
  type: http
  seq: 6

http:
  method: GET
  url: "{{baseUrl}}/api/notifications/unread-count"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("zero", function() {
          expect(res.body.count).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  After "mark all read" the bell shows no number.
