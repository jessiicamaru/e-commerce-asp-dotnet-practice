info:
  name: marking a notice read
  type: http
  seq: 4

http:
  method: POST
  url: "{{baseUrl}}/api/notifications/{{notificationId}}/read"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 204", function() {
          expect(res.status).to.equal(204);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Choosing a notice marks it read. Marking it again is also 204 - read is read.
