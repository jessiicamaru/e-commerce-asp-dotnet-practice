info:
  name: marking another person notice is 404
  type: http
  seq: 3

http:
  method: POST
  url: "{{baseUrl}}/api/notifications/{{notificationId}}/read"
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 404, not 403", function() {
          expect(res.status).to.equal(404);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The customer's notice, marked by somebody else - here an administrator, because an inbox is personal and
  no role reads another's. 404 rather than 403, so the id is not confirmed to exist (specs/042).
