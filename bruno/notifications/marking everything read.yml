info:
  name: marking everything read
  type: http
  seq: 5

http:
  method: POST
  url: "{{baseUrl}}/api/notifications/read-all"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("says how many it marked", function() {
          expect(res.body.marked).to.be.a("number");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The bell's "mark all read". Returns how many were still unread.
