info:
  name: express is put back
  type: http
  seq: 22

http:
  method: PUT
  url: "{{baseUrl}}/api/orders/delivery/options/express"
  body:
    type: json
    data: |-
      {}
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        const express = JSON.parse(bru.getVar("expressBefore"));
        req.setBody({ name: express.name, isActive: express.isActive, sortOrder: express.sortOrder, prices: express.prices,
          minDays: express.minDays === undefined ? null : express.minDays, maxDays: express.maxDays === undefined ? null : express.maxDays });
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Leaves express as it was before this run, its time included.
