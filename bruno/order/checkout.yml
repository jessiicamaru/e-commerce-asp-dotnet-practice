info:
  name: checkout
  type: http
  seq: 2

http:
  method: POST
  url: "{{baseUrl}}/api/orders"
  body:
    type: json
    data: |-
      {
        "addressId": "{{addressId}}",
        "shippingOption": "express"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.orderId) bru.setVar("orderId", res.body.orderId);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("sent to the chosen address, charged for express delivery", function() {
          expect(res.body.shippingAddress.recipientName).to.equal("Bruno Customer");
          expect(res.body.shippingOption.code).to.equal("express");
          expect(res.body.shippingPrice).to.equal(bru.getVar("expressPrice"));
        });
        test("the parts of the total add up, with tax at the destination's rate", function() {
          const b = res.body;
          const cents = v => Math.round(v * 100);
          expect(cents(b.subtotal) + cents(b.shippingPrice) + cents(b.taxTotal) - cents(b.discountTotal)).to.equal(cents(b.totalAmount));
          expect(b.taxRate).to.be.a("number");
          expect(b.discountTotal).to.equal(0);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  The body says **where** (`addressId`, omitted = your default) and **how** (`shippingOption`,
  required). What is bought comes from the cart, who is buying from the token, and what it costs
  from Catalog plus the delivery option. Any other field is ignored.

  - Empty cart -> **409**; no address and no default -> **409**
  - Unknown `addressId` (including somebody else's) -> **404**
  - Missing or unknown `shippingOption` -> **400**
  - Catalog, Cart or Identity unreachable -> **503**

  `totalAmount` = items + delivery, and that is what Payment is asked to take. The order keeps a
  **copy** of the address: editing the address book later does not move it.
