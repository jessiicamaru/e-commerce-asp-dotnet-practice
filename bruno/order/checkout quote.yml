info:
  name: checkout quote
  type: http
  seq: 2

http:
  method: GET
  url: "{{baseUrl}}/api/orders/quote?addressId={{addressId}}&shippingOption=express"
  params:
    - name: addressId
      value: "{{addressId}}"
      type: query
    - name: shippingOption
      value: express
      type: query
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: after-response
      code: |-
        if (res.body && res.body.totalAmount !== undefined) bru.setVar("quoteTotal", res.body.totalAmount);
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("the parts of the quote add up", function() {
          const b = res.body;
          const cents = v => Math.round(v * 100);
          expect(cents(b.subtotal) + cents(b.shippingPrice) + cents(b.taxTotal) - cents(b.discountTotal)).to.equal(cents(b.totalAmount));
          expect(b.shippingOption.code).to.equal("express");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  What `checkout` would charge for the same choices, in the same parts, **without placing anything**.
  The same code prices both, so `checkout` below asserts it charged exactly this total.
  It refuses exactly what checkout refuses: empty cart or no address **409**, unknown address
  **404**, unknown delivery option **400**.
