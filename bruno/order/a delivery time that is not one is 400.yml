info:
  name: a delivery time that is not one is 400
  type: http
  seq: 21

http:
  method: PUT
  url: "{{baseUrl}}/api/orders/delivery/options/express"
  body:
    type: json
    data: |-
      {}
  auth:
    type: bearer
    token: "{{adminToken}}"

runtime:
  scripts:
    - type: before-request
      code: |-
        // Express as stored, so this request changes only its time and the last one puts it back.
        const axios = require("axios");
        const settings = await axios.get(bru.interpolate("{{baseUrl}}/api/orders/delivery"),
          { headers: { Authorization: "Bearer " + bru.getVar("adminToken") } });
        const express = settings.data.options.filter(function(o) { return o.code === "express"; })[0];
        req.setBody({ name: express.name, isActive: express.isActive, sortOrder: express.sortOrder, prices: express.prices, minDays: 3, maxDays: 1 });
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("names the field", function() {
          expect(Object.keys(res.body.errors)).to.include("MaxDays");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

