info:
  name: the carrier is public
  type: http
  seq: 17

http:
  method: GET
  url: "{{baseUrl}}/api/orders/delivery/carrier"
  auth:
    auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200 without a token", function() {
          expect(res.status).to.equal(200);
        });
        test("it is the one just saved", function() {
          expect(res.body.name).to.equal("Bruno Carrier");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Public, so every page can link a reference. The next request puts the carrier back as it was.
