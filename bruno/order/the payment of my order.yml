info:
  name: the payment of my order
  type: http
  seq: 23

http:
  method: GET
  url: "{{baseUrl}}/api/payments/orders/{{orderId}}/checkout"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        // How an order's payment stands, for its owner (specs/143). With the stub the order is long decided by now;
        // with VNPay it may still wait for the customer, with a signed link to the gateway.
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("a known state, from a named provider", function() {
          expect(["Preparing", "AwaitingPayment", "Expired", "Paid", "Failed"]).to.include(res.body.state);
          expect(res.body.provider).to.be.a("string");
        });
        test("a link only while it waits", function() {
          if (res.body.state === "AwaitingPayment") expect(res.body.payUrl).to.contain("vnp_SecureHash=");
          else expect(res.body.payUrl).to.equal(null);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
