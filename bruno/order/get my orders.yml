info:
  name: get my orders
  type: http
  seq: 11

http:
  method: GET
  url: "{{baseUrl}}/api/orders?page=1&pageSize=20"
  params:
    - name: page
      value: "1"
      type: query
    - name: pageSize
      value: "20"
      type: query
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        // What is in each order, by name (specs/132): at most three lines.
        test("each order names its lines", function() {
          expect(res.body.items.length).to.be.above(0);
          res.body.items.forEach(function(order) {
            expect(order.lines).to.be.an("array");
            expect(order.lines.length).to.be.within(1, 3);
            expect(order.lines[0].productName).to.be.a("string");
          });
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
