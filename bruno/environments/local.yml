name: local
variables:
  - name: baseUrl
    value: http://localhost:5000
    description: The YARP gateway. Every request goes through it, like a real client would.
  - name: customerEmail
    value: bruno.customer@example.test
    description: A throwaway customer. "register" creates it; if it already exists, just run "login customer".
  - name: customerPassword
    value: Bruno-Passw0rd!1
    description: Password for the throwaway customer above. Not a real credential.
  - secret: true
    name: adminEmail
    description: ADMIN_EMAIL from server/.env. Fill in inside Bruno - never commit it.
  - secret: true
    name: adminPassword
    description: ADMIN_PASSWORD from server/.env. Fill in inside Bruno - never commit it.
