info:
  name: list my addresses
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/addresses"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("exactly one default, listed first", function() {
          expect(res.body.filter(a => a.isDefault).length).to.equal(1);
          expect(res.body[0].isDefault).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
