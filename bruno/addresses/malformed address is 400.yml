info:
  name: malformed address is 400
  type: http
  seq: 8

http:
  method: POST
  url: "{{baseUrl}}/api/addresses"
  body:
    type: json
    data: |-
      {
        "recipientName": "",
        "line1": "1 St",
        "line2": null,
        "city": "Nowhere",
        "region": null,
        "postalCode": "1",
        "country": "XX",
        "phone": "+84 912 345 678"
      }
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 400", function() {
          expect(res.status).to.equal(400);
        });
        test("each malformed field is named", function() {
          const errors = JSON.stringify(res.body.errors || {});
          expect(errors).to.contain("PostalCode");
          expect(errors).to.contain("Country");
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
