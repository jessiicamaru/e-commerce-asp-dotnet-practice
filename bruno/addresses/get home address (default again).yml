info:
  name: get home address (default again)
  type: http
  seq: 7

http:
  method: GET
  url: "{{baseUrl}}/api/addresses/{{addressId}}"
  auth:
    type: bearer
    token: "{{customerToken}}"

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });
        test("home became the default when work was deleted", function() {
          expect(res.body.isDefault).to.equal(true);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
