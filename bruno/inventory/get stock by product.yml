info:
  name: get stock by product
  type: http
  seq: 3

http:
  method: GET
  url: "{{baseUrl}}/api/stock/{{productId}}"
  auth: inherit

runtime:
  scripts:
    - type: tests
      code: |-
        test("status 200", function() {
          expect(res.status).to.equal(200);
        });

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5

docs: |-
  Look at `quantityOnHand` **and** `quantityReserved`, not just `quantityAvailable`.
