services:
  postgres-identity:
    image: postgres:16-alpine
    container_name: ecommerce-identity-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_identity_db
    ports:
      # 5432 on the host is commonly taken by a locally installed PostgreSQL,
      # which would silently shadow this container. See docs/guides/troubleshooting.md
      - "5435:5432"
    volumes:
      - postgres_identity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-catalog:
    image: postgres:16-alpine
    container_name: ecommerce-catalog-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_catalog_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_catalog_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-orchestrator:
    image: postgres:16-alpine
    container_name: ecommerce-orchestrator-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_saga_db
    ports:
      - "5436:5432"
    volumes:
      - postgres_orchestrator_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-inventory:
    image: postgres:16-alpine
    container_name: ecommerce-inventory-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_inventory_db
    ports:
      - "5437:5432"
    volumes:
      - postgres_inventory_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # The cart's own database. Host port 5439: 5433-5438 are taken by the other six, and 5432 is
  # avoided on purpose because a natively installed PostgreSQL silently shadows it.
  postgres-cart:
    image: postgres:16-alpine
    container_name: ecommerce-cart-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_cart_db
    ports:
      - "5439:5432"
    volumes:
      - postgres_cart_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-payment:
    image: postgres:16-alpine
    container_name: ecommerce-payment-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_payment_db
    ports:
      - "5438:5432"
    volumes:
      - postgres_payment_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  # Activity (specs/041): the audit log, and in-app notifications.
  postgres-activity:
    image: postgres:16-alpine
    container_name: ecommerce-activity-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_activity_db
    ports:
      - "5440:5432"
    volumes:
      - postgres_activity_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  postgres-order:
    image: postgres:16-alpine
    container_name: ecommerce-order-db
    environment:
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=ecommerce_order_db
    ports:
      - "5434:5432"
    volumes:
      - postgres_order_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    container_name: e-commerce-pgadmin
    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    depends_on:
      - postgres-identity
      - postgres-catalog
      - postgres-orchestrator
      - postgres-order
      - postgres-inventory
      - postgres-payment
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: e-commerce-rabbitmq
    environment:
      - RABBITMQ_DEFAULT_USER=${RABBITMQ_USER}
      - RABBITMQ_DEFAULT_PASS=${RABBITMQ_PASSWORD}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  # Logs and traces from every service, in one searchable place (feature 013). The services ship to it
  # over OTLP when OTLP_ENDPOINT is set; the UI is on http://localhost:5380.
  # The admin password comes from .env and is REQUIRED - Seq refuses to start with an empty one, and
  # running it without authentication is not an option this file offers.
  seq:
    image: datalust/seq:2024.3
    container_name: e-commerce-seq
    environment:
      ACCEPT_EULA: "Y"
      SEQ_FIRSTRUN_ADMINPASSWORD: ${SEQ_ADMIN_PASSWORD:?Set SEQ_ADMIN_PASSWORD in server/.env - see .env.example}
    ports:
      - "5341:5341"   # ingestion (OTLP at /ingest/otlp)
      - "5380:80"     # UI
    volumes:
      - seq_data:/data
    restart: unless-stopped

  # Every email the stack sends lands here (specs/060) and nothing leaves the machine: SMTP on 1025, the
  # inbox at http://localhost:8025. Identity's dispatcher sends to it by default.
  mailpit:
    image: axllent/mailpit:v1.21
    container_name: e-commerce-mailpit
    environment:
      # On a volume: its own default is memory, and a restart then loses every email it caught.
      MP_DATABASE: /data/mailpit.db
    ports:
      - "1025:1025"   # SMTP
      - "8025:8025"   # UI and API
    volumes:
      - mailpit_data:/data
    restart: unless-stopped

  # Product images in object storage (specs/079, #114): S3-compatible, so every Catalog instance sees the same
  # bucket. SeaweedFS because MinIO no longer publishes community images. `weed mini` runs master, volume, filer
  # and the S3 gateway in one process - development only; production points Catalog at real S3.
  seaweedfs:
    image: chrislusf/seaweedfs:4.47
    container_name: e-commerce-seaweedfs
    command: ["mini", "-dir=/data", "-bucket=product-images", "-master.telemetry=false", "-admin.ui=false"]
    environment:
      # The one identity the gateway accepts (SigV4; a wrong secret is 403). Required, like every other secret.
      AWS_ACCESS_KEY_ID: ${SEAWEEDFS_ACCESS_KEY:?SEAWEEDFS_ACCESS_KEY must be set in .env}
      AWS_SECRET_ACCESS_KEY: ${SEAWEEDFS_SECRET_KEY:?SEAWEEDFS_SECRET_KEY must be set in .env}
    ports:
      - "8333:8333"   # S3 only; the master, filer and admin ports stay inside
    volumes:
      - seaweedfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s
    restart: unless-stopped

volumes:
  postgres_identity_data:
  postgres_catalog_data:
  postgres_orchestrator_data:
  postgres_order_data:
  postgres_inventory_data:
  postgres_payment_data:
  postgres_activity_data:
  postgres_cart_data:
  rabbitmq_data:
  mailpit_data:
  seq_data:
  seaweedfs_data:
