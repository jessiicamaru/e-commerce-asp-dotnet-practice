syntax = "proto3";

option csharp_namespace = "Ecommerce.Contracts.Grpc";

package catalog.pricing.v1;

// What a product costs, answered by the service that owns the price.
//
// This exists because Order used to take the unit price from the customer's own
// request - see issue #18, where a product listed at 40,000,000 was bought for 1,
// the stock was deducted, and the payment recorded 1.00 Approved.
service CatalogPricing {
  // Prices several products at once.
  //
  // ONE call per order, never one per line. Per-line calls leave the caller
  // holding partial state when the third line fails, and turn "refuse the order
  // in full" into something a person has to remember rather than something the
  // shape guarantees.
  rpc GetPrices (GetPricesRequest) returns (GetPricesResponse);

  // Describes products for DISPLAY, answering per product.
  //
  // Unlike GetPrices this never refuses the whole request because one product is missing: it
  // answers for the ones that exist and lists the ones that do not. GetPrices is all-or-nothing
  // because deciding a sale must be; a cart being shown needs the opposite, or one deleted product
  // would hide the price of everything else in it. Two callers, two questions, two methods.
  //
  // Additive: no existing method or message changes.
  rpc DescribeProducts (DescribeProductsRequest) returns (DescribeProductsResponse);

  // Prices several VARIANTS at once - the sellable unit since specs/020. All-or-nothing, for the
  // same reason as GetPrices: a sale is decided in full or not at all.
  rpc PriceVariants (PriceVariantsRequest) returns (PriceVariantsResponse);

  // Describes VARIANTS for display, answering per variant, like DescribeProducts.
  rpc DescribeVariants (DescribeVariantsRequest) returns (DescribeVariantsResponse);
}

message DescribeProductsRequest {
  repeated string product_ids = 1;
}

message DescribeProductsResponse {
  // The ones that exist.
  repeated PricedProduct products = 1;

  // The ones that do not. Reported, never an error.
  repeated string missing_product_ids = 2;
}

message GetPricesRequest {
  // Product ids as UUID strings. Duplicates are allowed; the response carries
  // each distinct product once.
  repeated string product_ids = 1;
}

message GetPricesResponse {
  repeated PricedProduct products = 1;
}

message PricedProduct {
  string product_id = 1;

  // The catalogue's name for it. Copied onto the order line so an order still
  // describes what was bought after the product is renamed or withdrawn.
  string name = 2;

  // A decimal, as a STRING, deliberately.
  //
  // Protobuf has no decimal type. `double` is the obvious choice and is wrong for
  // money: it cannot represent 0.1 exactly, and this system stores money as
  // decimal(18,2) because the constitution says so. A string crosses the wire
  // exactly and parses back with no rounding anywhere in between.
  //
  // sint64 scaled by 100 is the other correct answer, and it encodes an
  // assumption about scale into the contract. This does not.
  string price = 3;

  // Whether it can be bought - the question being asked, rather than whichever
  // flag Catalog happens to keep. If Catalog later gains a second reason
  // something cannot be sold, this contract does not change.
  bool sellable = 4;
}

// DELIBERATELY ABSENT: availability, stock, any count.
//
// Catalog holds an Availability read model fed by events from Inventory, and its
// own source carries a comment saying nothing may sell against it. Putting it in
// a payload whose entire purpose is deciding a sale would invite exactly that
// misuse. Stock is answered by Inventory, under a row lock, at reservation time.

// ---------------------------------------------------------------------------
// Variants (specs/020). A variant is the sellable unit: it carries the SKU and
// the price. These are ADDITIVE - GetPrices and DescribeProducts above are
// unchanged, so an image built before variants keeps working, and for every
// product that existed then, its id is also its only variant's id.
// ---------------------------------------------------------------------------

message PriceVariantsRequest {
  // Variant ids as UUID strings. Duplicates allowed; each distinct one is answered once.
  repeated string variant_ids = 1;

  // Which language to answer in (specs/021). The name and option summary come back in it, and Order
  // FREEZES them onto the line - so this decides the words an order keeps for good. Empty means the
  // shop's default, which is what an Order built before this feature sends.
  string language = 2;
}

message PriceVariantsResponse {
  repeated PricedVariant variants = 1;
}

message DescribeVariantsRequest {
  repeated string variant_ids = 1;

  // Which language to describe them in (specs/021). Empty means the shop's default.
  string language = 2;
}

message DescribeVariantsResponse {
  // The ones that exist.
  repeated PricedVariant variants = 1;

  // The ones that do not. Reported, never an error.
  repeated string missing_variant_ids = 2;
}

message PricedVariant {
  string variant_id = 1;

  // For context and for a link back to the product. Never what is priced.
  string product_id = 2;

  string sku = 3;

  // The PRODUCT's name: a variant is a shape of it, not a different thing.
  string name = 4;

  // What the customer chose, in words: "Kit: Body only · Colour: Black". Frozen onto the order line,
  // so an order still describes itself after the variant is renamed or withdrawn.
  string option_summary = 5;

  // A decimal, as a STRING, for the same reason as PricedProduct.price above.
  string price = 6;

  bool sellable = 7;
}
