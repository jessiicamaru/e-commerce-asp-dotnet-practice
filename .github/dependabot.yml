# Dependency updates for every ecosystem the project uses (specs/150, #293). Weekly. Per ecosystem at most two pull
# requests: one for minor and patch updates, one for majors (specs/153, #331 - the first run opened 19, 15 of them single
# majors). Each pull request is tested by CI like any other and merged by a person.
#
# Two majors are never proposed (specs/153 research D1):
#   - MassTransit 9: 8.x is Apache-2.0, 9.x is a commercial licence (massient.com/license). Moving is the owner's
#     licensing decision, not a bump. No other MassTransit version is proposed either, patches included (specs/155,
#     #353): on 8.5.11 a broker outage under load left receive endpoints stopped for good (3 runs of 3; 0 of 12 on
#     8.3.6), which CI cannot see, so a green pull request says nothing about it. 8.3.6 stays until a version passes
#     `loadtest/fault.sh broker` several times. A vulnerable MassTransit still fails the build (specs/150).
#   - PostgreSQL 17/18: a new major cannot start on the previous major's data directory. Upgrading is a dump and
#     restore of eight databases, planned with its own record - CI would pass it on empty test databases while
#     production's volumes refused to start.
version: 2
updates:
  - package-ecosystem: nuget
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "MassTransit*"
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
      nuget-major:
        update-types: [major]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-minor-and-patch:
        update-types: [minor, patch]
      npm-major:
        update-types: [major]

  # Base images: server/Dockerfile (the nine services) and client/Dockerfile (storefront, back office).
  - package-ecosystem: docker
    directories: [/server, /client]
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
      # Node moves from one LTS to the next by hand (#344): the newest major is often a Current release, not an LTS.
      - dependency-name: node
        update-types: ["version-update:semver-major"]
    groups:
      docker-minor-and-patch:
        update-types: [minor, patch]
      docker-major:
        update-types: [major]

  # The infrastructure images pinned in compose: PostgreSQL, RabbitMQ, Seq, Prometheus, Grafana, SeaweedFS, Caddy ...
  - package-ecosystem: docker-compose
    directory: /server
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: postgres
        update-types: ["version-update:semver-major"]
    groups:
      compose-minor-and-patch:
        update-types: [minor, patch]
      compose-major:
        update-types: [major]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      actions-minor-and-patch:
        update-types: [minor, patch]
      actions-major:
        update-types: [major]
