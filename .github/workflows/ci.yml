name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # The escape hatch, and the only route to overwriting an already-published
  # release. Deliberately NOT reachable by merging: no commit-message trigger, no
  # branch name, nothing a pull request can carry. Somebody has to open the Actions
  # tab and tick a box.
  #
  # It exists because a guarantee with no escape hatch gets worked around, and the
  # workaround here would be deleting the package - which breaks anything that had
  # already pulled it, cannot be undone, and leaves no record.
  workflow_dispatch:
    inputs:
      force_republish:
        description: 'Overwrite already-published sha- tags for this commit'
        type: boolean
        default: false

# Least privilege by default. Only the publish job widens this, and only for
# packages - see specs/006-release-and-rollback/contracts/release-artifacts.md.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jessiicamaru/ecommerce
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres-inventory:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_inventory_db
        ports: ['5437:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-payment:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_payment_db
        ports: ['5438:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-cart:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_cart_db
        ports: ['5439:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-order:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_order_db
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ecommerce.slnx

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release --no-restore

      # The suites need a real PostgreSQL: every guarantee they assert — no overselling under
      # concurrency, a unique constraint stopping a duplicate payment, a guarded UPDATE refusing
      # to re-settle an order — is the database's behaviour, and an in-memory provider would pass
      # against broken code.
      - name: Test
        env:
          DB_PASSWORD: postgres
        run: dotnet test Ecommerce.slnx --configuration Release --no-build --verbosity normal

      # Informational only: Microsoft.OpenApi 2.0.0 currently trips this.
      # Drop continue-on-error once the advisories are cleared to make it a gate.
      - name: Report vulnerable packages
        continue-on-error: true
        run: dotnet list Ecommerce.slnx package --vulnerable --include-transitive

  image-secrets:
    name: Image carries no secret
    runs-on: ubuntu-latest
    needs: build
    # Pull requests only. On a merge the same check runs inside `publish`, against
    # each of the seven images it is about to push. Without this job a PR would get
    # no scan at all, and a leaked credential would only be caught after merge.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      # One service is enough here: every image comes from the same Dockerfile and
      # the same .dockerignore, so a leak in one is a leak in all seven. On a merge
      # all seven are scanned anyway, because there the scanned bytes must be the
      # pushed bytes.
      - name: Build one image
        working-directory: server
        run: |
          docker build             --build-arg PROJECT=src/Services/Catalog/Ecommerce.Catalog.WebApi             -t ecommerce-catalog:ci .

      - name: Assert no credential in any layer
        run: .github/scripts/verify-image-has-no-secrets.sh ecommerce-catalog:ci

  schema-compatibility:
    name: Schema compatibility
    runs-on: ubuntu-latest
    # Pull requests only: the point is to inform a reviewer while they are still
    # deciding. By the time it is merged the decision has been taken.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs base...HEAD, so it needs both sides.
          fetch-depth: 0

      - name: Look for schema changes earlier images cannot survive
        id: check
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null || true
          .github/scripts/check-schema-compatibility.sh "origin/${{ github.base_ref }}" > /tmp/report.md
          if [ -s /tmp/report.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when there is something to say. A check that comments on every pull
      # request is noise, and noise is how a real warning gets scrolled past.
      - name: Comment on the pull request
        if: steps.check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('/tmp/report.md', 'utf8'),
            });

      # It never fails. Nothing is deployed anywhere, so a block would fire on a risk
      # that does not yet exist, be overridden as a matter of course, and teach people
      # that overriding this class of guard is routine. A guard people learn to ignore
      # is worse than none, because it carries authority it has not earned.
      - name: This check never blocks
        run: echo "Informational only - see specs/006-release-and-rollback/research.md D5"

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    # Both conditions, not either. Without `needs` a merge whose tests failed would
    # still publish something that looks releasable - worse than publishing nothing,
    # because the artifact exists and carries the implication that it passed. Without
    # the event guard every pull request would publish: this workflow triggers on
    # push AND pull_request to main.
    needs: [build, auth-smoke, saga-e2e]
    # A merge, or a deliberate manual run. Never a pull request - which is what this
    # guard was protecting against in the first place, and adding a third trigger is
    # exactly how that kind of guard gets loosened by accident.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'

    # One release at a time. Two changes merged close together otherwise produce two
    # runs that both push :main, in whatever order the runners happen to finish, so
    # :main can end up pointing at the OLDER of the two.
    #
    # cancel-in-progress is false on purpose, and it is the load-bearing half:
    # cancelling a publish mid-loop is precisely how a partial release happens, and
    # not producing those is what this job now exists to guarantee.
    concurrency:
      group: publish-images
      cancel-in-progress: false

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ALL SEVEN are built and scanned BEFORE ANY is pushed - which is a statement
      # about THIS step, and about nothing else.
      #
      # The original version of this comment went on to say "a partial release is not
      # a release", as though the job could not produce one. It could, and it did: on
      # 2026-09-21 the push loop below published three of seven and failed. Build and
      # scan being all-or-nothing says nothing about what happens while pushing. That
      # is the same defect as the `fail-fast` claim corrected during feature 006 - a
      # comment asserting a property the code does not have - and it is why the push
      # step now checks before it writes and the job ends by asking the registry
      # whether all seven names exist. See specs/008-immutable-release-tags.
      #
      # Not a matrix, deliberately. A matrix runs the services in parallel, so one
      # failing after others have pushed leaves a partial release, and one job also
      # shares the SDK and restore layers across all seven builds, so sequential here
      # is not seven times the work.
      #
      # The order build -> scan -> push is the other half. Before this job existed a
      # separate image-secrets job built its own Catalog image and scanned THAT; once
      # images are published, the scanned bytes and the shipped bytes would be
      # different artifacts and the guarantee would attach to the wrong one. This
      # repository is public: a credential in a published layer is readable by anyone,
      # and one that has been pulled must be ROTATED, not deleted.
      - name: Build and scan every service
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          while IFS='|' read -r service project; do
            [ -n "$service" ] || continue
            echo "::group::$service"
            docker build \
              --build-arg "PROJECT=$project" \
              -t "$IMAGE_PREFIX-$service:sha-$SHORT_SHA" \
              -t "$IMAGE_PREFIX-$service:main" \
              server
            .github/scripts/verify-image-has-no-secrets.sh "$IMAGE_PREFIX-$service:sha-$SHORT_SHA"
            echo "::endgroup::"
          done <<'SERVICES'
          identity|src/Services/Identity/Ecommerce.Identity.WebApi
          catalog|src/Services/Catalog/Ecommerce.Catalog.WebApi
          order|src/Services/Order/Ecommerce.Order.WebApi
          orchestrator|src/Services/Orchestrator/Ecommerce.Orchestrator.WebApi
          inventory|src/Services/Inventory/Ecommerce.Inventory.WebApi
          payment|src/Services/Payment/Ecommerce.Payment.WebApi
          cart|src/Services/Cart/Ecommerce.Cart.WebApi
          gateway|src/ApiGateway/Ecommerce.ApiGateway
          SERVICES

      - name: Log in to GHCR
        # No stored secret: GITHUB_TOKEN is minted per run, scoped by the permissions
        # block above, and expires with the job. The constitution requires that secrets
        # are never written into a workflow file; needing none is the strongest form.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push every service
        # sha- is the only tag anything deployable may be named by, and this step is
        # what makes that true. Before feature 008 it was true only because nobody had
        # pushed twice: on 2026-09-21 a run failed partway, was re-run on the same
        # commit, and sha-2cee71a went from sha256:b7bfe138 to sha256:8d98ec97 for
        # identity, with catalog and order rewritten the same way. Nothing refused it.
        #
        # :main moves by design, so it can never answer "the previous version". That is
        # why it is pushed unconditionally while sha- is not.
        #
        # NOTE on the old comment above this step, which claimed "ALL SEVEN are built
        # and scanned BEFORE ANY is pushed [...] a partial release is not a release":
        # that is true of build->scan and says nothing about the loop below, which left
        # three of seven published the same day it was written. See specs/008.
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
          FORCE_REPUBLISH: ${{ github.event.inputs.force_republish || 'false' }}
        run: |
          set -euo pipefail

          SERVICES="identity catalog order orchestrator inventory payment cart gateway"

          # Does this name already refer to something?
          #
          # Exit status alone is NOT enough, and getting this wrong inverts the whole
          # guarantee. `docker manifest inspect` exits non-zero for three different
          # reasons and only two of them mean "safe to push":
          #
          #   exit 0                          -> the name resolves
          #   exit 1, "manifest unknown"      -> package exists, this tag does not
          #   exit 1, "denied"                -> package does not exist yet
          #   exit 1, anything else           -> the registry could not be ASKED
          #
          # A DNS failure, an expired token and an outage all land in the fourth row.
          # Reading those as "absent" would overwrite a published release because the
          # network hiccupped - using the check built to prevent exactly that. So the
          # fourth row aborts rather than guessing.
          #
          # Measured against the real registry, not inferred: specs/008 research D1.
          tag_state() {
            local ref="$1" err rc
            err="$(docker manifest inspect "$ref" 2>&1 >/dev/null)" && rc=0 || rc=$?
            if [ "$rc" -eq 0 ]; then
              echo exists
            elif printf '%s' "$err" | grep -qE 'manifest unknown|denied'; then
              echo absent
            else
              echo "unanswerable: $err" >&2
              echo unanswerable
            fi
          }

          # Bounded, and the bound matters as much as the retry. `unknown blob` is
          # transient - it surfaces when docker cross-mounts a shared layer from a
          # sibling GHCR package, and all seven images share their base layers, so
          # every service after the first is exposed. Unretried, one hiccup produced a
          # three-of-seven release. Retrying forever would turn a registry outage into
          # a job nobody can read the state of, which is worse than failing.
          push_with_retry() {
            local ref="$1" attempt
            for attempt in 1 2 3; do
              if docker push "$ref"; then
                [ "$attempt" -gt 1 ] && echo "    (succeeded on attempt $attempt)"
                return 0
              fi
              if [ "$attempt" -lt 3 ]; then
                local wait=$(( attempt == 1 ? 5 : 15 ))
                echo "    push failed (attempt $attempt/3); retrying in ${wait}s"
                sleep "$wait"
              fi
            done
            echo "::error::Giving up on $ref after 3 attempts."
            return 1
          }

          {
            echo "### Release sha-$SHORT_SHA"
            echo
            echo "| service | permanent tag |"
            echo "| :-- | :-- |"
          } >> "$GITHUB_STEP_SUMMARY"

          for service in $SERVICES; do
            permanent="$IMAGE_PREFIX-$service:sha-$SHORT_SHA"
            moving="$IMAGE_PREFIX-$service:main"

            if [ "$FORCE_REPUBLISH" = "true" ]; then
              echo "::warning::$service: force_republish is set - overwriting $permanent"
              push_with_retry "$permanent"
              outcome="republished (forced)"
            else
              case "$(tag_state "$permanent")" in
                exists)
                  echo "$service: already present, left unchanged"
                  outcome="already present, left unchanged"
                  ;;
                absent)
                  echo "$service: publishing"
                  push_with_retry "$permanent"
                  outcome="published"
                  ;;
                *)
                  echo "::error::Could not ask the registry about $permanent. Aborting rather than guessing: treating an unanswerable registry as 'absent' would overwrite an already-published release."
                  exit 1
                  ;;
              esac
            fi

            # The moving tag is never checked. It exists to move.
            push_with_retry "$moving"

            echo "| \`$service\` | $outcome |" >> "$GITHUB_STEP_SUMMARY"
          done

      - name: Confirm the release is whole
        # ASK the registry, do not count what the loop did.
        #
        # Counting answers "did the steps run?". Asking answers "does the release
        # exist?", and only the second is what a release is. This matters more now
        # that skipping is normal: without it, a run that skipped everything and a run
        # that quietly never reached a service look identical from the inside.
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          present=0
          missing=""
          # Counted from the list rather than written down as a number. "7" was hardcoded
          # here and in three messages, and went stale the moment an eighth service arrived -
          # the same drift the Dockerfile's COPY list and this job's other two lists suffer.
          SERVICES="identity catalog order orchestrator inventory payment cart gateway"
          total=$(set -- $SERVICES; echo $#)

          for service in $SERVICES; do
            if docker manifest inspect "$IMAGE_PREFIX-$service:sha-$SHORT_SHA" > /dev/null 2>&1; then
              present=$((present + 1))
            else
              missing="$missing $service"
            fi
          done

          if [ "$present" -eq "$total" ]; then
            echo "$total of $total permanent names present - release complete"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$total of $total permanent names present — release complete.**" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "**$present of $total permanent names present — release INCOMPLETE.**" >> "$GITHUB_STEP_SUMMARY"
            echo "Missing:$missing" >> "$GITHUB_STEP_SUMMARY"
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "Re-running this job publishes the missing ones and leaves the others untouched." >> "$GITHUB_STEP_SUMMARY"
            echo "::error::$present of $total permanent names present. Missing:$missing. Re-running this job will publish them and leave the rest untouched."
            exit 1
          fi

  auth-smoke:
    name: Auth smoke test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: server

    services:
      postgres-identity:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_identity_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Catalog publishes through MassTransit, so it needs a broker to reach a
      # healthy state. The built-in 'guest' account only accepts connections from
      # inside the container, so CI gets its own user.
      postgres-inventory:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_inventory_db
        ports: ['5437:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Order now consumes OrderCompletedEvent and OrderFailedEvent, so the smoke
      # test starts it too - the order ownership assertions are the only place a
      # REAL signed token is put through ICurrentUser and the owner filter.
      postgres-order-smoke:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_order_db
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Checkout reads the customer's cart (feature 010), and this job places an
      # order, so the cart and its database have to be up here too.
      postgres-cart:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_cart_db
        ports: ['5439:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      IDENTITY_DB_NAME: ecommerce_identity_db
      IDENTITY_DB_PORT: '5432'
      CATALOG_DB_NAME: ecommerce_catalog_db
      CATALOG_DB_PORT: '5433'
      INVENTORY_DB_NAME: ecommerce_inventory_db
      INVENTORY_DB_PORT: '5437'
      ORDER_DB_NAME: ecommerce_order_db
      ORDER_DB_PORT: '5434'
      CART_DB_NAME: ecommerce_cart_db
      CART_DB_PORT: '5439'
      # CI-only values. Real secrets belong in repository secrets, never here.
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: ci
      RABBITMQ_PASS: ci-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release

      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project src/Services/Identity/Ecommerce.Identity.Infrastructure/ \
            --startup-project src/Services/Identity/Ecommerce.Identity.WebApi/
          dotnet ef database update \
            --project src/Services/Catalog/Ecommerce.Catalog.Infrastructure/ \
            --startup-project src/Services/Catalog/Ecommerce.Catalog.WebApi/
          dotnet ef database update \
            --project src/Services/Order/Ecommerce.Order.Infrastructure/ \
            --startup-project src/Services/Order/Ecommerce.Order.WebApi/
          dotnet ef database update \
            --project src/Services/Cart/Ecommerce.Cart.Infrastructure/ \
            --startup-project src/Services/Cart/Ecommerce.Cart.WebApi/

      - name: Start services
        run: |
          # Both services pin their own URL via app.Run("http://localhost:50XX").
          dotnet run --project src/Services/Identity/Ecommerce.Identity.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/identity.log 2>&1 &
          dotnet run --project src/Services/Catalog/Ecommerce.Catalog.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/catalog.log 2>&1 &
          dotnet run --project src/Services/Order/Ecommerce.Order.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/order.log 2>&1 &
          dotnet run --project src/Services/Cart/Ecommerce.Cart.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/cart.log 2>&1 &

          # 000 means nothing is listening yet; anything else means the service
          # answered, so a non-2xx tells us it is up but reporting unhealthy.
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" || echo 000; }

          identity_code=000
          catalog_code=000
          order_code=000
          cart_code=000

          for i in $(seq 1 90); do
            identity_code=$(probe http://localhost:5056/health)
            catalog_code=$(probe http://localhost:5057/health)
            order_code=$(probe http://localhost:5059/health)
            cart_code=$(probe http://localhost:5062/health)

            if [ "$identity_code" = "200" ] && [ "$catalog_code" = "200" ] && [ "$order_code" = "200" ] && [ "$cart_code" = "200" ]; then
              echo "All four services are healthy after ${i}s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Not healthy in time (identity=$identity_code, catalog=$catalog_code, order=$order_code, cart=$cart_code; 000 = not listening)."

          for name in identity:5056 catalog:5057 order:5059 cart:5062; do
            echo "--- ${name%%:*} /health ---"
            curl -s -i --max-time 5 "http://localhost:${name##*:}/health" || echo "(no response)"
            echo
          done

          echo "--- listening sockets ---"
          ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true
          exit 1

      # Guards the security boundary: an unauthenticated caller must be rejected,
      # a Customer must not reach Admin-only endpoints, and the roles the startup
      # initializer seeds must actually arrive in the token. The same script runs
      # locally against ./start-dev.ps1.
      - name: Verify authentication and authorization
        run: ../.github/scripts/verify-auth.sh

      # Startup lines matter most, and a retrying transport can push them far out
      # of a plain tail, so show both ends of each log.
      - name: Dump service logs on failure
        if: failure()
        run: |
          for service in identity catalog order cart; do
            echo "::group::$service (first 60 lines)"
            head -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
            echo "::group::$service (last 60 lines)"
            tail -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
          done

  # The only check that can see the gaps BETWEEN services. Every other test in
  # this repository is confined to one service, which is why Inventory and Order
  # could both declare a consumer class named OrderCompletedConsumer - binding to
  # one queue and competing for the event - while all fifteen Order tests stayed
  # green and the order settled with its stock still held.
  #
  # Its own job rather than part of auth-smoke, deliberately: that job needs three
  # services and this one needs six, so merging them would turn a Payment startup
  # problem into a red AUTHENTICATION check. Both depend only on `build`, so they
  # run concurrently and the wall-clock cost is max(), not sum().
  saga-e2e:
    name: Saga end-to-end
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: server

    services:
      postgres-identity:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_identity_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-order:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_order_db
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-saga:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_saga_db
        ports: ['5436:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-inventory:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_inventory_db
        ports: ['5437:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-payment:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_payment_db
        ports: ['5438:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-cart:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_cart_db
        ports: ['5439:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # The saga is the thing under test, so a real broker is not optional here:
      # the queue-name collision this check exists to catch is invisible without
      # one. The built-in 'guest' account only accepts connections from inside
      # the container, so CI gets its own user.
      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      IDENTITY_DB_NAME: ecommerce_identity_db
      IDENTITY_DB_PORT: '5432'
      CATALOG_DB_NAME: ecommerce_catalog_db
      CATALOG_DB_PORT: '5433'
      ORDER_DB_NAME: ecommerce_order_db
      ORDER_DB_PORT: '5434'
      # The orchestrator is the one service whose two variables disagree with
      # each other: the database is named by SAGA_DB_NAME and the port by
      # ORCHESTRATOR_DB_PORT. Setting ORCHESTRATOR_DB_NAME instead looks right
      # and does nothing.
      SAGA_DB_NAME: ecommerce_saga_db
      ORCHESTRATOR_DB_PORT: '5436'
      INVENTORY_DB_NAME: ecommerce_inventory_db
      INVENTORY_DB_PORT: '5437'
      PAYMENT_DB_NAME: ecommerce_payment_db
      PAYMENT_DB_PORT: '5438'
      CART_DB_NAME: ecommerce_cart_db
      CART_DB_PORT: '5439'
      # CI-only values. Real secrets belong in repository secrets, never here.
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: ci
      RABBITMQ_PASS: ci-password
      # The job started every service, so "not listening" is this job's failure
      # rather than a reason to excuse itself. Locally the same script skips and
      # says so, which is correct there and would be a hole here.
      SAGA_E2E_REQUIRE_ALL: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release

      - name: Apply migrations
        run: |
          set -euo pipefail
          # The orchestrator is the one service where --project and
          # --startup-project are the same: its DbContext lives in the WebApi
          # project rather than in an Infrastructure one.
          dotnet ef database update \
            --project src/Services/Identity/Ecommerce.Identity.Infrastructure/ \
            --startup-project src/Services/Identity/Ecommerce.Identity.WebApi/
          dotnet ef database update \
            --project src/Services/Catalog/Ecommerce.Catalog.Infrastructure/ \
            --startup-project src/Services/Catalog/Ecommerce.Catalog.WebApi/
          dotnet ef database update \
            --project src/Services/Order/Ecommerce.Order.Infrastructure/ \
            --startup-project src/Services/Order/Ecommerce.Order.WebApi/
          dotnet ef database update \
            --project src/Services/Orchestrator/Ecommerce.Orchestrator.WebApi/ \
            --startup-project src/Services/Orchestrator/Ecommerce.Orchestrator.WebApi/
          dotnet ef database update \
            --project src/Services/Inventory/Ecommerce.Inventory.Infrastructure/ \
            --startup-project src/Services/Inventory/Ecommerce.Inventory.WebApi/
          dotnet ef database update \
            --project src/Services/Payment/Ecommerce.Payment.Infrastructure/ \
            --startup-project src/Services/Payment/Ecommerce.Payment.WebApi/
          dotnet ef database update \
            --project src/Services/Cart/Ecommerce.Cart.Infrastructure/ \
            --startup-project src/Services/Cart/Ecommerce.Cart.WebApi/

      - name: Start services
        run: |
          set -euo pipefail
          start() {
            dotnet run --project "src/Services/$1/Ecommerce.$1.WebApi/" \
              --configuration Release --no-build --no-launch-profile \
              > "/tmp/$2.log" 2>&1 &
          }

          start Identity identity
          start Catalog catalog
          start Order order
          start Orchestrator orchestrator
          start Inventory inventory
          start Payment payment
          start Cart cart

          # 000 means nothing is listening; anything else means the service
          # answered, so a non-2xx tells us it is up but reporting unhealthy.
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" || true; }

          # The orchestrator has NO /health endpoint - it has no controllers -
          # so it is deliberately absent here. Nothing can wait for it, which is
          # why verify-saga.sh names it first when an order stalls.
          ready=0
          for _ in $(seq 1 120); do
            ok=1
            for pair in identity:5056 catalog:5057 order:5059 inventory:5060 payment:5061 cart:5062; do
              [ "$(probe "http://localhost:${pair##*:}/health")" = "200" ] || ok=0
            done
            if [ "$ok" = "1" ]; then ready=1; break; fi
            sleep 1
          done

          if [ "$ready" != "1" ]; then
            for pair in identity:5056 catalog:5057 order:5059 inventory:5060 payment:5061 cart:5062; do
              echo "::error::${pair%%:*} did not become healthy (last code: $(probe "http://localhost:${pair##*:}/health"); 000 = not listening)."
            done
            exit 1
          fi
          echo "Five probed services are healthy; the orchestrator has no /health to probe."

      # Payment resolves its outcome ONCE, in StubPaymentGateway's constructor,
      # so one running instance produces one of the two scenarios. Two instances
      # at the same time would both host a ProcessPaymentCommand consumer of the
      # same class name, bind to the same queue, and COMPETE - which is the very
      # failure this job exists to detect.
      - name: Scenario 1 - payment approves
        run: ../.github/scripts/verify-saga.sh

      - name: Restart Payment, refusing
        run: |
          set -euo pipefail
          pkill -f 'Ecommerce.Payment.WebApi' || true
          for _ in $(seq 1 30); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:5061/health || true)" = "000" ] && break
            sleep 1
          done

          PAYMENT_OUTCOME=Reject dotnet run \
            --project src/Services/Payment/Ecommerce.Payment.WebApi/ \
            --configuration Release --no-build --no-launch-profile \
            > /tmp/payment-reject.log 2>&1 &

          for _ in $(seq 1 60); do
            [ "$(curl -s -o /dev/null -w '%{http_code}' --max-time 2 http://localhost:5061/health || true)" = "200" ] && break
            sleep 1
          done

          # Assert the restart actually took. Without this, a Payment that came
          # back approving would make scenario 2 run the SAME scenario as
          # scenario 1 and report a pass for a branch nobody exercised.
          outcome="$(curl -s --max-time 5 http://localhost:5061/health \
            | python3 -c 'import json,sys; print(json.load(sys.stdin).get("configuredOutcome",""))')"
          [ "$outcome" = "Rejected" ] || { echo "::error::Payment restarted reporting '$outcome', expected 'Rejected'."; exit 1; }
          echo "Payment is now refusing."

      - name: Scenario 2 - payment refuses
        run: ../.github/scripts/verify-saga.sh

      # Startup lines matter most, and a retrying transport can push them far out
      # of a plain tail, so show both ends of each log.
      - name: Dump service logs on failure
        if: failure()
        run: |
          for service in identity catalog order orchestrator inventory payment payment-reject cart; do
            echo "::group::$service (first 60 lines)"
            head -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
            echo "::group::$service (last 60 lines)"
            tail -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
          done
