name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege by default. Only the publish job widens this, and only for
# packages - see specs/006-release-and-rollback/contracts/release-artifacts.md.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/jessiicamaru/ecommerce
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build and test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    services:
      postgres-inventory:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_inventory_db
        ports: ['5437:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-payment:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_payment_db
        ports: ['5438:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-order:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_order_db
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore Ecommerce.slnx

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release --no-restore

      # The suites need a real PostgreSQL: every guarantee they assert — no overselling under
      # concurrency, a unique constraint stopping a duplicate payment, a guarded UPDATE refusing
      # to re-settle an order — is the database's behaviour, and an in-memory provider would pass
      # against broken code.
      - name: Test
        env:
          DB_PASSWORD: postgres
        run: dotnet test Ecommerce.slnx --configuration Release --no-build --verbosity normal

      # Informational only: Microsoft.OpenApi 2.0.0 currently trips this.
      # Drop continue-on-error once the advisories are cleared to make it a gate.
      - name: Report vulnerable packages
        continue-on-error: true
        run: dotnet list Ecommerce.slnx package --vulnerable --include-transitive

  image-secrets:
    name: Image carries no secret
    runs-on: ubuntu-latest
    needs: build
    # Pull requests only. On a merge the same check runs inside `publish`, against
    # each of the seven images it is about to push. Without this job a PR would get
    # no scan at all, and a leaked credential would only be caught after merge.
    if: github.event_name == 'pull_request'

    steps:
      - uses: actions/checkout@v4

      # One service is enough here: every image comes from the same Dockerfile and
      # the same .dockerignore, so a leak in one is a leak in all seven. On a merge
      # all seven are scanned anyway, because there the scanned bytes must be the
      # pushed bytes.
      - name: Build one image
        working-directory: server
        run: |
          docker build             --build-arg PROJECT=src/Services/Catalog/Ecommerce.Catalog.WebApi             -t ecommerce-catalog:ci .

      - name: Assert no credential in any layer
        run: .github/scripts/verify-image-has-no-secrets.sh ecommerce-catalog:ci

  schema-compatibility:
    name: Schema compatibility
    runs-on: ubuntu-latest
    # Pull requests only: the point is to inform a reviewer while they are still
    # deciding. By the time it is merged the decision has been taken.
    if: github.event_name == 'pull_request'

    permissions:
      contents: read
      pull-requests: write

    steps:
      - uses: actions/checkout@v4
        with:
          # The script diffs base...HEAD, so it needs both sides.
          fetch-depth: 0

      - name: Look for schema changes earlier images cannot survive
        id: check
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=0 origin "${{ github.base_ref }}" 2>/dev/null || true
          .github/scripts/check-schema-compatibility.sh "origin/${{ github.base_ref }}" > /tmp/report.md
          if [ -s /tmp/report.md ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      # Only when there is something to say. A check that comments on every pull
      # request is noise, and noise is how a real warning gets scrolled past.
      - name: Comment on the pull request
        if: steps.check.outputs.found == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: fs.readFileSync('/tmp/report.md', 'utf8'),
            });

      # It never fails. Nothing is deployed anywhere, so a block would fire on a risk
      # that does not yet exist, be overridden as a matter of course, and teach people
      # that overriding this class of guard is routine. A guard people learn to ignore
      # is worse than none, because it carries authority it has not earned.
      - name: This check never blocks
        run: echo "Informational only - see specs/006-release-and-rollback/research.md D5"

  publish:
    name: Publish images
    runs-on: ubuntu-latest
    # Both conditions, not either. Without `needs` a merge whose tests failed would
    # still publish something that looks releasable - worse than publishing nothing,
    # because the artifact exists and carries the implication that it passed. Without
    # the event guard every pull request would publish: this workflow triggers on
    # push AND pull_request to main.
    needs: [build, auth-smoke]
    if: github.event_name == 'push'

    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Short SHA
        id: sha
        run: echo "short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      # ALL SEVEN are built and scanned BEFORE ANY is pushed.
      #
      # Not a matrix, deliberately. A matrix runs the services in parallel, so one
      # failing after others have pushed leaves a partial release - and a partial
      # release is not a release. One job also shares the SDK and restore layers
      # across all seven builds, so sequential here is not seven times the work.
      #
      # The order build -> scan -> push is the other half. Before this job existed a
      # separate image-secrets job built its own Catalog image and scanned THAT; once
      # images are published, the scanned bytes and the shipped bytes would be
      # different artifacts and the guarantee would attach to the wrong one. This
      # repository is public: a credential in a published layer is readable by anyone,
      # and one that has been pulled must be ROTATED, not deleted.
      # ALL SEVEN are built and scanned BEFORE ANY is pushed.
      #
      # Not a matrix, deliberately. A matrix runs the services in parallel, so one
      # failing after others have pushed leaves a partial release - and a partial
      # release is not a release. One job also shares the SDK and restore layers
      # across all seven builds, so sequential here is not seven times the work.
      #
      # The order build -> scan -> push is the other half. Before this job existed a
      # separate image-secrets job built its own Catalog image and scanned THAT; once
      # images are published, the scanned bytes and the shipped bytes would be
      # different artifacts and the guarantee would attach to the wrong one. This
      # repository is public: a credential in a published layer is readable by anyone,
      # and one that has been pulled must be ROTATED, not deleted.
      - name: Build and scan all seven
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          while IFS='|' read -r service project; do
            [ -n "$service" ] || continue
            echo "::group::$service"
            docker build \
              --build-arg "PROJECT=$project" \
              -t "$IMAGE_PREFIX-$service:sha-$SHORT_SHA" \
              -t "$IMAGE_PREFIX-$service:main" \
              server
            .github/scripts/verify-image-has-no-secrets.sh "$IMAGE_PREFIX-$service:sha-$SHORT_SHA"
            echo "::endgroup::"
          done <<'SERVICES'
          identity|src/Services/Identity/Ecommerce.Identity.WebApi
          catalog|src/Services/Catalog/Ecommerce.Catalog.WebApi
          order|src/Services/Order/Ecommerce.Order.WebApi
          orchestrator|src/Services/Orchestrator/Ecommerce.Orchestrator.WebApi
          inventory|src/Services/Inventory/Ecommerce.Inventory.WebApi
          payment|src/Services/Payment/Ecommerce.Payment.WebApi
          gateway|src/ApiGateway/Ecommerce.ApiGateway
          SERVICES

      - name: Log in to GHCR
        # No stored secret: GITHUB_TOKEN is minted per run, scoped by the permissions
        # block above, and expires with the job. The constitution requires that secrets
        # are never written into a workflow file; needing none is the strongest form.
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push all seven
        # sha- is immutable and is the only tag anything deployable may be named by.
        # :main moves, so it can never answer "the previous version" - it is a
        # convenience, and the contract says so.
        env:
          SHORT_SHA: ${{ steps.sha.outputs.short }}
        run: |
          set -euo pipefail
          echo "### Published sha-$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          for service in identity catalog order orchestrator inventory payment gateway; do
            docker push "$IMAGE_PREFIX-$service:sha-$SHORT_SHA"
            docker push "$IMAGE_PREFIX-$service:main"
            echo "- $IMAGE_PREFIX-$service:sha-$SHORT_SHA" >> "$GITHUB_STEP_SUMMARY"
          done

  auth-smoke:
    name: Auth smoke test
    runs-on: ubuntu-latest
    needs: build
    defaults:
      run:
        working-directory: server

    services:
      postgres-identity:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_identity_db
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      postgres-catalog:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_catalog_db
        ports: ['5433:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Catalog publishes through MassTransit, so it needs a broker to reach a
      # healthy state. The built-in 'guest' account only accepts connections from
      # inside the container, so CI gets its own user.
      postgres-inventory:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_inventory_db
        ports: ['5437:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      # Order now consumes OrderCompletedEvent and OrderFailedEvent, so the smoke
      # test starts it too - the order ownership assertions are the only place a
      # REAL signed token is put through ICurrentUser and the owner filter.
      postgres-order-smoke:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ecommerce_order_db
        ports: ['5434:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        env:
          RABBITMQ_DEFAULT_USER: ci
          RABBITMQ_DEFAULT_PASS: ci-password
        ports: ['5672:5672']
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 12

    env:
      DB_USER: postgres
      DB_PASSWORD: postgres
      IDENTITY_DB_NAME: ecommerce_identity_db
      IDENTITY_DB_PORT: '5432'
      CATALOG_DB_NAME: ecommerce_catalog_db
      CATALOG_DB_PORT: '5433'
      INVENTORY_DB_NAME: ecommerce_inventory_db
      INVENTORY_DB_PORT: '5437'
      ORDER_DB_NAME: ecommerce_order_db
      ORDER_DB_PORT: '5434'
      # CI-only values. Real secrets belong in repository secrets, never here.
      JWT_SECRET: ci-only-jwt-secret-at-least-32-bytes-long
      ADMIN_EMAIL: admin@ci.local
      ADMIN_PASSWORD: ci-admin-password
      RABBITMQ_HOST: localhost
      RABBITMQ_USER: ci
      RABBITMQ_PASS: ci-password

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('server/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Install EF Core tools
        run: |
          dotnet tool install --global dotnet-ef --version 10.0.11
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Build
        run: dotnet build Ecommerce.slnx --configuration Release

      - name: Apply migrations
        run: |
          dotnet ef database update \
            --project src/Services/Identity/Ecommerce.Identity.Infrastructure/ \
            --startup-project src/Services/Identity/Ecommerce.Identity.WebApi/
          dotnet ef database update \
            --project src/Services/Catalog/Ecommerce.Catalog.Infrastructure/ \
            --startup-project src/Services/Catalog/Ecommerce.Catalog.WebApi/
          dotnet ef database update \
            --project src/Services/Order/Ecommerce.Order.Infrastructure/ \
            --startup-project src/Services/Order/Ecommerce.Order.WebApi/

      - name: Start services
        run: |
          # Both services pin their own URL via app.Run("http://localhost:50XX").
          dotnet run --project src/Services/Identity/Ecommerce.Identity.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/identity.log 2>&1 &
          dotnet run --project src/Services/Catalog/Ecommerce.Catalog.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/catalog.log 2>&1 &
          dotnet run --project src/Services/Order/Ecommerce.Order.WebApi/ \
            --configuration Release --no-build --no-launch-profile > /tmp/order.log 2>&1 &

          # 000 means nothing is listening yet; anything else means the service
          # answered, so a non-2xx tells us it is up but reporting unhealthy.
          probe() { curl -s -o /dev/null -w '%{http_code}' --max-time 5 "$1" || echo 000; }

          identity_code=000
          catalog_code=000
          order_code=000

          for i in $(seq 1 90); do
            identity_code=$(probe http://localhost:5056/health)
            catalog_code=$(probe http://localhost:5057/health)
            order_code=$(probe http://localhost:5059/health)

            if [ "$identity_code" = "200" ] && [ "$catalog_code" = "200" ] && [ "$order_code" = "200" ]; then
              echo "All three services are healthy after ${i}s."
              exit 0
            fi
            sleep 1
          done

          echo "::error::Not healthy in time (identity=$identity_code, catalog=$catalog_code, order=$order_code; 000 = not listening)."

          for name in identity:5056 catalog:5057 order:5059; do
            echo "--- ${name%%:*} /health ---"
            curl -s -i --max-time 5 "http://localhost:${name##*:}/health" || echo "(no response)"
            echo
          done

          echo "--- listening sockets ---"
          ss -ltnp 2>/dev/null || netstat -ltnp 2>/dev/null || true
          exit 1

      # Guards the security boundary: an unauthenticated caller must be rejected,
      # a Customer must not reach Admin-only endpoints, and the roles the startup
      # initializer seeds must actually arrive in the token. The same script runs
      # locally against ./start-dev.ps1.
      - name: Verify authentication and authorization
        run: ../.github/scripts/verify-auth.sh

      # Startup lines matter most, and a retrying transport can push them far out
      # of a plain tail, so show both ends of each log.
      - name: Dump service logs on failure
        if: failure()
        run: |
          for service in identity catalog order; do
            echo "::group::$service (first 60 lines)"
            head -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
            echo "::group::$service (last 60 lines)"
            tail -60 "/tmp/$service.log" 2>/dev/null || echo "(no log)"
            echo "::endgroup::"
          done
